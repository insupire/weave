# 패키지 선언 — 검사기를 **의존으로 들 수 있게** 낸다.
#
# 이 저장소가 내는 계약은 「스키마 검사기」 하나다. 그것을 못 부르면 읽는 쪽이 스키마를 베껴
# 자기 자리에서 다시 판정하고, 그 순간 검사기가 두 벌이 된다. 베낀 쪽은 우리가 스키마를 고치는
# 날 조용히 낡는다 — 그것이 이 파일이 막는 것이다.
#
# **정본 스키마가 설치본에 함께 간다.** `weave/` 는 판정만 갖고 어휘·모양·제약은 전부 `schema/`
# 에 있다. 그것이 빠진 설치본은 읽을 것이 없어 첫 호출에서 죽는다. `force-include` 가 최상위
# `schema/` 를 **옮기지 않고** 바퀴 안의 `weave/schema/` 로 넣는다 — 저장소의 정본 자리는
# 그대로 최상위 `schema/` 이고, 그리는 쪽이 `$ref` 를 그대로 복사해 가는 자리도 그대로다.
# 실제로 함께 실렸는지는 `make install-check` 가 깨끗한 환경에서 본다.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weave"
dynamic = ["version"]
description = "분석뷰를 선언하는 스키마와 그 검사기"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20"]

# **판은 하나다.** 스키마와 검사기가 따로 판을 갖지 않는다 — 검사기는 스키마를 읽어 판정하기만
# 해서 둘이 따로 움직일 수 없고, 번호가 둘이면 맞추는 일이 생기고 맞추는 일은 어긋난다.
# 정본은 `weave/__init__.py` 의 `__version__` 이고, 든 쪽은 그것을 값으로 읽는다.
[tool.hatch.version]
path = "weave/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["weave"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "weave/schema"
