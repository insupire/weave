# 필수 전체 회귀. 게이트 목록의 정본은 Makefile 하나이고 여기에 다시 적지 않는다.
name: ci

# **기준 브랜치로 향하는 PR 에서만 돈다.** 작업 브랜치끼리 여는 PR 이나 브랜치 push 에서는 돌지 않는다.
# 생성만이 아니라 갱신(synchronize)과 재개(reopened)에서도 다시 잰다 — 랜딩 PR 에 커밋을 얹으면
# 입력이 달라지므로 앞 회차의 결과를 그대로 믿을 수 없다.
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

# 같은 PR 의 앞 회차만 취소한다. 다른 PR 의 회차는 건드리지 않는다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  all:
    name: make all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 얕은 클론을 쓰지 않는다

      # 실행기 둘을 여기서 못박는다. python 은 검사기와 빌더, node 는 그리는 쪽의 고정 케이스.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 실행기를 적어 둔다
        run: |
          python3 --version
          node --version

      # test · types-check · check · viewer-check · viewer-test.
      # node 가 없으면 viewer-test 가 건너뛰지 않고 이름을 대고 실패한다.
      - name: make all
        run: make all
