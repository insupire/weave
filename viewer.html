<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>weave 설명서</title>
<!--
  이 파일은 tools/build_viewer.py 가 viewer/ · samples/ · catalog/ 에서 만든다. 손으로 고치지 않는다.
  의존성이 없다 — CDN 도 서버도 쓰지 않는다. 파일을 브라우저로 열면 바로 돈다.
-->
<style>
/* 설명서의 시각.
 *
 * 규칙 넷 — 취향이 아니라 이 저장소가 서 있는 이유다.
 *   1. **색은 주석 갈래에서만 나온다.** subject 도 값도 색으로 가르지 않는다 —
 *      가르는 것은 이름·무늬·굵기·크기·여백이다.
 *   2. 순위·등급·경고를 시각으로 되살리지 않는다. 주석 갈래의 색은 통용 시맨틱이지 심각도 순위가 아니다.
 *   3. 렌더 출력에 도구 껍데기가 없다.
 *   4. 파일 하나로 열린다. 웹폰트도 네트워크를 타지 않으므로 시스템 글꼴로 간다.
 *
 * **띠와 상자로 말하던 것을 글자로 말하게 한다.** 테두리·채움·모서리는 각각 별개의 물건이라는
 * 뜻이므로 역할을 보고만 쓴다. radius 는 한 값뿐이고 진짜 컨테이너에만 붙는다.
 */

:root {
  --ink:#1a1a1a;       /* 본문 */
  --mute:#6b6b6b;      /* 딸린 말 */
  --line:#d9d9d9;      /* 구조선 */
  --surface:#f6f6f6;   /* 옅은 면 */
  --r:3px;             /* 하나뿐인 모서리. 진짜 컨테이너에만 */

  /* **세로 리듬은 자 셋에서만 나온다.** 값이 제각각이면 어디서 끊기는지 눈이 못 읽는다.
     한 자를 고치면 그 층 전체가 함께 움직인다. */
  --row:6px;           /* 줄과 줄 — 주석 한 줄 다음 줄, 묶음과 묶음도 같은 값이다 */
  --step:14px;         /* 한 facet 안의 층 — 제목·본문·말 */
  --gap:30px;          /* facet 과 facet — 선이 그 한가운데 선다 */
}

/* list 한 칸 안의 열들. 한 항목의 여러 열은 하나의 자로 줄일 수 없어 그 안에서만 나란히 선다. */
.cell-pair { display:block; font-size:13px; }
.cell-pair .who { font-weight:400; color:var(--mute); margin-right:4px; }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; color:var(--ink); background:#ffffff;
  font:15px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }

/* ---------------------------------------------------------------- 설명서의 뼈대 */

.site { display:grid; grid-template-columns:216px 1fr; height:100%; }
.nav { border-right:1px solid var(--line); overflow:auto; padding-bottom:24px; background:var(--surface); }
.brand { font-size:14px; font-weight:700; letter-spacing:.02em; padding:16px 18px 12px; }
.nav .group { font-size:11px; color:var(--mute); padding:16px 18px 4px; letter-spacing:.04em; }
.toc-link { display:block; width:100%; text-align:left; border:none; background:none;
  padding:5px 18px; font:inherit; font-size:13.5px; color:var(--mute); cursor:pointer; }
.toc-link:hover { color:var(--ink); }
.toc-link.has-icon { display:flex; align-items:center; gap:9px; }
/* primitive element 표시. 구조를 가리킬 뿐 도메인을 가리키지 않는다. 다섯이 같은 무게다. */
.toc-icon { flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:1.3;
  stroke-linecap:round; opacity:.75; }
.toc-link[aria-pressed="true"] .toc-icon { opacity:1; }
/* 고른 것은 굵기로 말한다. 왼쪽 띠를 대지 않는다. */
.toc-link[aria-pressed="true"] { color:var(--ink); font-weight:700; background:var(--surface); }

.content { min-width:0; min-height:0; overflow:auto; }
.page { max-width:720px; padding:36px 32px 96px; margin:0 auto; }
.page-head { margin-bottom:20px; }
h1 { font-size:26px; margin:0 0 10px; letter-spacing:-.015em; }
h1 code { font-size:25px; }
.lead { font-size:15px; color:var(--mute); margin:0; max-width:62ch; }
.page p { max-width:68ch; }
.page > h2 { font-size:12px; color:var(--mute); font-weight:600; margin:32px 0 10px;
  display:block; letter-spacing:.04em; }
code { font:12px ui-monospace,SFMono-Regular,Menlo,monospace; }
.limits { display:grid; grid-template-columns:max-content 1fr; gap:4px 16px; margin:20px 0 0; font-size:13.5px; }
.limits dt { color:var(--mute); }
.limits dd { margin:0; }
.note-line { font-size:13.5px; color:var(--mute); margin:12px 0 0; max-width:68ch; }
/* 코드는 회색 상자가 아니라 글꼴로 갈린다 */
pre { margin:0; padding:0; overflow-x:auto; color:var(--ink);
  font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace; }
/* 산 렌더와 산문 사이는 진짜 경계라 틀이 하나 선다 */
.demo { border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; }
/* focus 를 따라 바뀌는 element 는 고른 것을 달리한 두 장으로 보인다 */
.shot + .shot { margin-top:14px; }
.shot-said { font-size:11px; color:var(--mute); margin-bottom:6px; letter-spacing:.03em; }
.demo h1 { font-size:11px; color:var(--mute); font-weight:600; margin:0 0 10px; letter-spacing:.04em; }
.demo .facet, .demo .facet:first-of-type { border-top:none; padding:0; }

/* ---------------------------------------------------------------- 플레이그라운드 */

.playground { display:flex; flex-direction:column; height:100%; }
.playground[hidden] { display:none; }
.playground .page-head { padding:24px 28px 14px; margin:0; }
.playground h1 { font-size:19px; }
.panes { display:grid; grid-template-columns:minmax(320px, 44%) 1fr; flex:1; min-height:0;
  border-top:1px solid var(--line); }
.pane { min-width:0; min-height:0; display:flex; flex-direction:column; }
.pane.edit { border-right:1px solid var(--line); }
/* 판은 스크롤하지 않는다. 띠는 붙박이로 두고 본문만 굴린다 —
   띄우는 방식이 아니라 구조로 가른 자리다. */
.pane.view { overflow:hidden; }
.scroll { flex:1; min-height:0; overflow:auto; }
.viewport { padding:28px 28px 72px; max-width:880px; margin:0 auto; }

.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  padding:10px 14px; border-bottom:1px solid var(--line); }
.bar .push { margin-left:auto; }
select, button { font:inherit; font-size:13px; color:var(--ink);
  background:#ffffff; border:1px solid var(--line); border-radius:var(--r); padding:4px 9px; }
button { cursor:pointer; }
button:hover { background:var(--surface); }
button[aria-pressed="true"] { background:var(--ink); color:#ffffff; border-color:var(--ink); }
/* focus 나열. 항목에 none 이 있어 무엇을 고르는 줄인지 스스로 읽힌다 — 라벨을 두지 않는다. */
#focus-buttons { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
button.pick { padding:3px 10px; font-size:12.5px; }
label { font-size:12px; color:var(--mute); }
label:has(input) { display:inline-flex; align-items:center; gap:5px; }

/* 탭은 고른 것을 **굵기와 색조**로 말한다. 밑줄도 상자도 두르지 않는다 —
   밑줄로 활성을 말하는 것은 왼쪽 띠를 아래로 옮긴 것뿐이다.
   `.tabs` 의 아래 선은 활성 표시가 아니라 편집기와의 판 구분선이다. */
.tabs { display:flex; flex-wrap:wrap; gap:2px; align-items:baseline;
  padding:0 10px; border-bottom:1px solid var(--line); }
.tab { border:none; background:none; padding:9px 10px; font-size:12.5px; color:var(--mute); }
.tab:hover { background:none; color:var(--ink); }
.tab[aria-pressed="true"] { background:none; color:var(--ink); font-weight:700; }
.tab .bad { font-weight:700; }
/* 탭 하나가 곧 subject 다. 템플릿은 하나뿐이라 홀로 앞에 서고, 사이를 자리(간격)가 가른다.
   묶는 말을 두지 않는다 — 탭이 이미 subject 인데 그 위에 또 적으면 같은 말을 두 번 한다. */
.tab-subject:first-of-type { margin-left:16px; }

textarea { flex:1; width:100%; margin:0; border:none; padding:14px;
  resize:none; background:#ffffff; color:var(--ink);
  font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; tab-size:2; }
textarea:focus { outline:2px solid var(--ink); outline-offset:-2px; }
.strip { border-top:1px solid var(--line); padding:10px 14px;
  font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; max-height:26vh; overflow:auto; }
.strip:empty { display:none; }
.strip b { display:block; margin-bottom:4px; }
.strip ul { margin:0; padding-left:16px; }
.strip li { color:var(--ink); }

/* ---------------------------------------------------------------- 분석뷰 */

h2 { font-size:17px; margin:0 0 10px; display:flex; align-items:baseline; gap:8px; letter-spacing:-.01em; }
/* primitive element 이름은 설명서가 켤 때만 붙는다. 알약이 아니라 작은 글이다. */
.show-elements h2[data-element]::after { content:attr(data-element);
  font:11px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--mute); font-weight:400; }
/* focus 는 색이 아니라 테두리와 굵기로 말한다 */
th.is-focus { outline:2px solid var(--ink); outline-offset:1px; }
.is-focus > .who, th.is-focus { font-weight:700; }
/* **선은 두 facet 의 한가운데 선다.** 위 여백은 앞 facet 의 아래 여백이고 아래 여백은
   이 facet 의 위 여백이라, 둘이 같아야 선이 가운데로 온다 — 그래서 한 자로 적는다. */
.facet { border-top:1px solid var(--line); padding:var(--gap) 0; }
/* 첫 facet 위에는 선이 없다. 그래도 제목이 분석뷰 제목에 붙지 않게 한 층을 띄운다. */
.facet:first-of-type { border-top:none; padding-top:var(--step); }
.facet h2 { margin-bottom:0; }
.body { margin-top:var(--step); }
.field-label { font-size:12.5px; color:var(--mute); margin-bottom:8px; }
.who { font-size:12.5px; color:var(--mute); }
.miss { font-size:12.5px; color:var(--mute); }
.dash { color:var(--mute); }
/* 틀이 아니라 자리다 */
.blank { padding:4px 0 8px; }
/* 그리지 못한 자리. 테두리 친 알약이 아니라 굵은 monospace 다. */
.broken, .undrawable { font:12px ui-monospace,SFMono-Regular,Menlo,monospace;
  font-weight:700; color:var(--ink); }

/* 겹치는 쪽 (line · list) — 값을 못 얹은 subject 는 축 아래에 선다 */
.offs { display:flex; flex-wrap:wrap; gap:14px; margin-top:var(--row); }
.off { font-size:12.5px; color:var(--mute); }
.off.is-focus { color:var(--ink); }
.off.is-focus .who { font-weight:700; }

/* focus 를 따라 바뀌는 쪽 (stat · facts · bars) — 무엇을 보고 있는지 늘 이름으로 말한다 */
/* 무엇을 보고 있는지는 **화면에 한 번** — 오른쪽 띠가 말한다. facet 마다 되풀이하지 않는다. */
.watching { font-size:12px; color:var(--mute); white-space:nowrap; }
.watching b { color:var(--ink); }
.facts { display:grid; grid-template-columns:max-content 1fr; gap:6px 18px; margin:0; font-size:14px; }
.fact { display:contents; }
.facts dt { color:var(--mute); font-size:13px; padding-top:1px; }
.facts dd { margin:0; }
.big { font-size:27px; letter-spacing:-.01em; display:flex; align-items:center; gap:2px; }
.big .note-mark { vertical-align:baseline; }
.big .miss, .big .undrawable { font-size:15px; }

/* 막대. 자는 subject 전체의 최대값으로 고정돼 focus 를 옮겨도 길이를 견줄 수 있다. */
.bar-row { display:grid; grid-template-columns:130px 1fr 150px; gap:12px; align-items:center; padding:4px 2px; }
.bar-row .who { font-size:13px; color:var(--mute); }
.track { display:block; height:10px; background:var(--surface); }
.fill { display:block; height:100%; background:var(--ink); }
.val { font-size:13px; text-align:right; }

/* **표만 옆으로 굴린다.** subject 가 늘수록 넓어지는 유일한 자리다 — 페이지 전체가 옆으로
   밀리면 왼쪽 목차도 위쪽 띠도 함께 사라진다. 그래서 스크롤은 이 상자의 것이다. */
.table-scroll { overflow-x:auto; margin-top:var(--step); }
/* 열 너비가 균일하다. 자리마다 너비가 다르면 넓은 칸이 중요해 보인다 —
   `fixed` 가 남은 폭을 고르게 나누고, 다 못 담으면 표가 상자 밖으로 넘쳐 굴러간다. */
table { border-collapse:collapse; table-layout:fixed; width:max-content; min-width:100%;
  font-size:14px; }
th, td { border:1px solid var(--line); padding:8px 11px; text-align:left; vertical-align:top; }
thead th { font-weight:600; font-size:13px; width:180px; }
th.corner, th.row-label { font-weight:600; width:140px; color:var(--mute); }

/* 축이 이미 틀이다. 테두리를 두르지 않는다. */
svg.line { width:100%; height:auto; background:#ffffff; }
svg .axis { stroke:var(--line); stroke-width:1; }
svg .tick { font-size:11px; fill:var(--mute); }
svg .ty { text-anchor:end; }
svg .tx { text-anchor:start; }
svg .tx.end { text-anchor:end; }
/* **선을 가르는 것은 무늬와 이름뿐이다.** 색을 쓰지 않으므로 무늬가 뚜렷해야 하고,
   선 끝의 이름이 무늬를 글로 받아 준다 — 겹쳐도 어느 선인지 이름으로 읽힌다. */
svg .series { fill:none; stroke:var(--ink); stroke-width:1.6; opacity:.55; }
svg .series.is-focus { stroke-width:2.6; opacity:1; }
svg circle.series, svg circle.dot { fill:var(--ink); stroke:none; }
svg .series-label { font-size:11px; fill:var(--mute); font-weight:600;
  paint-order:stroke; stroke:#ffffff; stroke-width:3px; stroke-linejoin:round; }
svg .series-label.is-focus { fill:var(--ink); font-weight:700; }

/* 주석은 띠가 아니라 **글**로 읽힌다.
   **줄 사이가 전부 같다** — 한 묶음 안이든 묶음과 묶음 사이든 `--row` 하나다.
   간격으로 무엇을 가르지 않는다. 가르는 일은 글(이름)이 한다. */
.notes { list-style:none; margin:0; padding:0;
  display:flex; flex-direction:column; gap:var(--row); }
.body .notes { margin-top:var(--step); }
.note { display:grid; grid-template-columns:2.8em 1fr; gap:0 10px; font-size:12.5px; }
.note .kind { color:var(--kind, var(--mute)); font-size:11px; line-height:1.85; white-space:nowrap; }

/* **필드에 붙는 말.** 표시는 값 옆에 늘 서 있고 내용은 가리키거나 초점을 받으면 열린다.
   갈래 표시가 보이는 것이 핵심이다 — 인용(근거)과 주의(한계)는 값과 함께 읽혀야 뜻이 산다. */
.note-mark { position:relative; display:inline-flex; align-items:center; gap:2px;
  margin-left:6px; vertical-align:-2px; cursor:help; color:var(--mute); }
.note-mark:hover, .note-mark:focus { color:var(--ink); outline:none; }
.note-mark:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
.note-more { font-size:10px; }
.note-pop { position:absolute; left:0; top:calc(100% + 6px); z-index:5; display:none;
  min-width:260px; max-width:min(380px, 60vw); padding:10px 12px;
  background:#ffffff; border:1px solid var(--line); border-radius:var(--r); text-align:left; }
.note-mark:hover .note-pop, .note-mark:focus-within .note-pop, .note-mark:focus .note-pop { display:block; }
.note-pop .notes { margin-top:0; }
.note-pop .note { cursor:auto; }
.pop-close { display:none; }

/* 주석 갈래의 색. **통용되는 UI 시맨틱을 따른다** — 주의는 warning, 보충은 info.
   이 자리를 어떻게 읽으라는 말이지 **그 제안서가 좋고 나쁘다는 말이 아니다.**
   그래서 색은 갈래 표시와 갈래 이름에만 얹고 값이나 글에는 얹지 않는다.
   **색이 나오는 곳은 여기뿐이다** — 값·subject·facet 에서는 색이 나오지 않는다. */
.note-quote { --kind:var(--mute); }   /* 근거·출처. 상태가 아니다 */
.note-tip { --kind:#175cd3; }         /* 도움말의 통용색 */
.note-note { --kind:var(--mute); }    /* info — 사람이 준 예대로 중립 회색 */
.note-caution { --kind:#b42318; }     /* warning 의 통용색 */

.kind-icon { width:12px; height:12px; margin-right:4px; vertical-align:-2px;
  fill:none; stroke:var(--kind, var(--mute)); stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round; }
.note .kind, .note-mark .kind-icon { color:var(--kind, var(--mute)); }
.note .text { color:var(--ink); }
/* 좁은 자리에서는 매달린 라벨이 폭을 먹는다. 같은 줄에 흘려 보낸다. */
td .note { display:block; }
td .note .kind { display:inline; margin-right:5px; line-height:inherit; }
/* **두 묶음을 가르는 것은 여백이 아니라 이 이름이다.** subject 것은 이름이 앞에 서고
   facet 것은 서지 않는다 — 그래서 간격을 벌리지 않아도 한 줄만 읽으면 누구 말인지 안다. */
.note .who { font-weight:600; color:var(--mute); }
/* 말은 데이터 뒤에 한자리에 모인다. 묶음 사이도 줄 사이와 같은 자다. */
.said { margin-top:var(--step); display:flex; flex-direction:column; gap:var(--row); }

@media (max-width: 900px) {
  /* 좁은 화면엔 가리키기가 없다. 아래에서 올라오는 판으로 연다. */
  .note-pop { position:fixed; inset:auto 0 0 0; max-width:none; min-width:0;
    border:none; border-top:1px solid var(--line); padding:18px 18px 22px; }
  .pop-close { display:block; margin-top:14px; margin-left:auto; }

  /* 좁아도 판이 스스로 스크롤한다 — 문서 전체가 밀리면 띠가 또 사라진다. */
  .site { grid-template-columns:1fr; grid-template-rows:auto 1fr; }
  /* 목차가 판을 스스로 스크롤하게 됐으므로 위쪽을 다 먹지 않게 묶는다. */
  .nav { border-right:none; border-bottom:1px solid var(--line); max-height:34vh; }
  .nav nav { display:flex; flex-wrap:wrap; gap:2px; padding:0 12px 12px; }
  .nav .group { width:100%; padding:10px 6px 2px; }
  .toc-link { width:auto; padding:4px 10px; }
  .page { padding:24px 20px 64px; }
  .panes { grid-template-columns:1fr; grid-template-rows:minmax(280px, 45%) 1fr; }
  .pane.edit { border-right:none; border-bottom:1px solid var(--line); }
  /* 좁아도 표는 자기 상자에서 굴러간다 — 열은 그대로 균일하다. */
  .bar-row { grid-template-columns:90px 1fr; }
  .bar-row .val { text-align:left; grid-column:2; }
}
</style>
</head>
<body>
<div class="site">
  <!-- 목차. 정본은 카탈로그다 — primitive element 가 늘거나 줄면 여기가 따라 바뀐다. -->
  <aside class="nav">
    <div class="brand">weave</div>
    <nav id="toc"></nav>
  </aside>

  <main class="content">
    <!-- 설명서 쪽. 고른 항목 하나를 그린다. -->
    <article class="page" id="page"></article>

    <!-- 플레이그라운드. DOM 을 살려 둬야 편집 중인 글이 안 날아간다. -->
    <section class="playground" id="playground" hidden>
      <header class="page-head">
        <h1 id="pg-title"></h1>
        <p class="lead" id="pg-lead"></p>
      </header>
      <div class="panes">
        <div class="pane edit">
          <div class="bar">
            <label for="sample">샘플</label>
            <select id="sample"></select>
            <button type="button" id="add-subject"
              title="전부 비어 있는 값 한 벌이 생긴다">＋ subject</button>
            <button type="button" id="drop-subject"
              title="지금 보고 있는 subject 를 지운다. 템플릿 탭에서는 마지막 것">－ subject</button>
          </div>
          <div class="tabs" id="tabs"></div>
          <textarea id="editor" spellcheck="false" autocomplete="off"></textarea>
          <div class="strip" id="strip"></div>
        </div>
        <div class="pane view">
          <div class="bar">
            <span id="focus-buttons"></span>
            <span class="watching" id="watching"></span>
            <label class="push"><input type="checkbox" id="show-elements"> primitive element 이름</label>
          </div>
          <!-- 스크롤하는 것은 본문뿐이다. 띠는 바깥에 있어 늘 제자리를 지킨다. -->
          <div class="scroll">
            <div class="viewport" id="view"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
<script type="module">
// ---- viewer/icons.mjs ----
// lucide 아이콘. **실물을 그대로 옮겼다** — 기억으로 그리지 않는다.
//
//   출처   npm lucide-static@1.44.0 의 icons/<name>.svg
//   라이선스 ISC — Copyright (c) 2026 Lucide Icons and Contributors
//            https://github.com/lucide-icons/lucide/blob/main/LICENSE
//   다시 받기 npm pack lucide-static@1.44.0 로 풀어 icons/ 에서 아래 이름을 꺼낸다
//
// CDN 도 아이콘 폰트도 쓰지 않는다 — 파일 하나로 열려야 하므로 여기 인라인한다.
// 주석 넷은 **통용되는 UI 시맨틱**을 따른다 — 주의는 warning, 보충은 info.
// primitive element 다섯은 구조를 가리킨다. 도메인(돈·병원·서류) 그림은 두지 않는다.

const LUCIDE_VERSION = "1.44.0";

const ICON = {
  // 주석 갈래 — 인용. 근거·출처라 상태가 아니다 (lucide `quote`)
  quote: "<path d=\"M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\" /> <path d=\"M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\" />",
  // 주석 갈래 — 팁. 도움말의 통용 표시 (lucide `lightbulb`)
  tip: "<path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5\" /> <path d=\"M9 18h6\" /> <path d=\"M10 22h4\" />",
  // 주석 갈래 — 보충. info 의 통용 표시 (lucide `info`)
  note: "<circle cx=\"12\" cy=\"12\" r=\"10\" /> <path d=\"M12 16v-4\" /> <path d=\"M12 8h.01\" />",
  // 주석 갈래 — 주의. warning 의 통용 표시 (lucide `circle-alert`)
  caution: "<circle cx=\"12\" cy=\"12\" r=\"10\" /> <line x1=\"12\" x2=\"12\" y1=\"8\" y2=\"12\" /> <line x1=\"12\" x2=\"12.01\" y1=\"16\" y2=\"16\" />",
  // primitive element — stat (lucide `hash`)
  stat: "<line x1=\"4\" x2=\"20\" y1=\"9\" y2=\"9\" /> <line x1=\"4\" x2=\"20\" y1=\"15\" y2=\"15\" /> <line x1=\"10\" x2=\"8\" y1=\"3\" y2=\"21\" /> <line x1=\"16\" x2=\"14\" y1=\"3\" y2=\"21\" />",
  // primitive element — facts (lucide `table-properties`)
  facts: "<path d=\"M15 3v18\" /> <rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\" /> <path d=\"M21 9H3\" /> <path d=\"M21 15H3\" />",
  // primitive element — bars (lucide `chart-bar`)
  bars: "<path d=\"M3 3v16a2 2 0 0 0 2 2h16\" /> <path d=\"M7 16h8\" /> <path d=\"M7 11h12\" /> <path d=\"M7 6h3\" />",
  // primitive element — line (lucide `chart-line`)
  line: "<path d=\"M3 3v16a2 2 0 0 0 2 2h16\" /> <path d=\"m19 9-5 5-4-4-3 3\" />",
  // primitive element — list (lucide `table`)
  list: "<path d=\"M12 3v18\" /> <rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\" /> <path d=\"M3 9h18\" /> <path d=\"M3 15h18\" />",
};

// ---- viewer/render.mjs ----
// 참조 렌더. 무엇이 올바른 렌더인지의 기준이다.
//
// 순수 함수다 — 문서를 받아 HTML 문자열을 낸다. DOM 을 모른다. 그래서 브라우저 없이도
// 고정 케이스를 걸 수 있다 (`tests/viewer.test.mjs`).
//
// **facet 종류를 아는 분기가 없다.** element 로만 고른다 (ELEMENTS 표).
// **subject 마다 값 한 벌이 정확히 하나 있다.** 비어 있을 수 있고, 누가 자리에 서는지는 그 값 한 벌들이
// 말한다 — 명단을 따로 받지 않는다. 아직 분석되지 않았다는 것도 특별한 상태가 아니라
// **전부 비어 있는 값 한 벌과 주석**이 말한다.
// **판정하지 않는다.** 스키마 판정의 정본은 Python 검사기 하나다. 여기서는 그리지 못하는
// 자리를 표시하고 무엇이 이상한지 적기만 한다.


// 주석 갈래 넷의 **정본 이름**이다(glossary §2.4). 참조 뷰어는 언어를 배우는 자리라
// 읽기 좋은 딴 이름을 쓰지 않는다 — 제품 화면의 라벨은 앱이 따로 정한다.
const KIND_LABEL = { quote: "인용", tip: "팁", note: "보충", caution: "주의" };

const NO_VALUE = "값 없음";
const NO_ITEMS = "항목 없음";
const UNDRAWABLE = "그리지 못한다";

// **선을 subject 별로 가르는 유일한 방법.** 색을 쓰지 않는다 — 무늬는 우열을 말하지 않고,
// 인쇄와 색각 이상에서도 그대로 갈린다. 자리 차례로 돌려 쓰며 값의 크기와 무관하다.
// 이름은 늘 선 끝에 글로 함께 선다 — 무늬만으로 가르지 않는다.
const DASHES = ["", "7 4", "2 3", "11 4 2 4", "1 3", "6 3 1 3 1 3"];

function esc(text) {
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#x27;");
}

// ---------------------------------------------------------------- 값 읽기

function cell(valueset, facetId, key) {
  if (!valueset) return { state: "empty", entry: null };
  const facet = valueset.facets?.[facetId];
  if (!facet) return { state: "empty", entry: null };
  const entry = facet.fields?.[key];
  if (!entry || entry.state !== "filled") return { state: "empty", entry: entry ?? null };
  return { state: "filled", entry };
}

function facetNotes(valueset, facetId) {
  return valueset?.facets?.[facetId]?.notes ?? [];
}

// ---------------------------------------------------------------- 값 쓰기

function grouped(value) {
  if (typeof value !== "number" || !Number.isFinite(value)) return String(value);
  return value.toLocaleString("en-US", { maximumFractionDigits: 10 });
}

function formatScalar(type, value) {
  if (type === "boolean") return value ? "예" : "아니오";
  if (type === "text" || type === "date") return String(value);
  if (typeof value !== "number" || !Number.isFinite(value)) return String(value);
  if (type === "money") return `${grouped(value)}원`;
  if (type === "ratio") return `${grouped(Math.round(value * 1e10) / 1e8)}%`;
  if (type === "duration") return `${grouped(value)}개월`;
  if (type === "age") return `${grouped(value)}세`;
  return grouped(value);
}

function formatValue(decl, value) {
  if (decl.shape === "single") return formatScalar(decl.type, value);
  if (decl.shape === "range") {
    if (value === null || typeof value !== "object" || Array.isArray(value)) return null;
    const low = "min" in value ? formatScalar(decl.type, value.min) : null;
    const high = "max" in value ? formatScalar(decl.type, value.max) : null;
    if (low !== null && high !== null) return `${low} ~ ${high}`;
    if (low !== null) return `${low} 이상`;
    if (high !== null) return `${high} 이하`;
    return null;
  }
  return null;
}

function axisNumber(axis, raw) {
  if (axis === "date") {
    const ms = Date.parse(`${raw}T00:00:00Z`);
    return Number.isNaN(ms) ? null : ms / 86400000;
  }
  return typeof raw === "number" && Number.isFinite(raw) ? raw : null;
}

// ---------------------------------------------------------------- HTML 조각

/** 갈래 표시. **통용되는 UI 시맨틱을 따른다** — 주의는 warning, 보충은 info.
 *  색은 갈래(`note-<kind>`)에서만 나온다. 값이나 subject 에서는 나오지 않는다. */
function kindIcon(kind) {
  const body = ICON[kind];
  if (!body) return "";
  return (
    `<svg class="kind-icon note-${esc(kind)}" viewBox="0 0 24 24" width="14" height="14" ` +
    `aria-hidden="true">${body}</svg>`
  );
}

/**
 * **필드에 붙는 주석.** 본문에 펼치지 않고 표시를 세워 그 자리에서 연다.
 *
 * 감추는 만큼 잃는 것이 있으므로 **갈래 표시는 값 옆에 확실히 선다** — 인용(근거)과
 * 주의(한계)가 붙어 있다는 것 자체가 값과 함께 읽혀야 하는 정보다.
 * 여는 길 셋 — 가리키기(hover) · 초점(키보드) · 좁은 화면에서는 아래에서 올라오는 판.
 */
function notePop(notes) {
  if (!Array.isArray(notes) || notes.length === 0) return "";
  const marks = notes.slice(0, 3).map((n) => kindIcon(n?.kind ?? "note")).join("");
  const more = notes.length > 3 ? `<span class="note-more">+${notes.length - 3}</span>` : "";
  return (
    `<span class="note-mark" tabindex="0" role="button" aria-label="붙은 말 ${notes.length}">` +
    `${marks}${more}<span class="note-pop" role="tooltip">${notesHtml(notes)}` +
    `<button type="button" class="pop-close">닫기</button></span></span>`
  );
}

function notesHtml(notes, where = "") {
  if (!Array.isArray(notes) || notes.length === 0) return "";
  const rows = notes.map((note) => {
    const kind = note?.kind ?? "note";
    const label = KIND_LABEL[kind] ?? kind;
    const prefix = where ? `<b class="who">${esc(where)}</b> ` : "";
    return (
      `<li class="note note-${esc(kind)}"><span class="kind">${kindIcon(kind)}${esc(label)}</span>` +
      `<span class="text">${prefix}${esc(note?.text ?? "")}</span></li>`
    );
  });
  return `<ul class="notes">${rows.join("")}</ul>`;
}

/** 값이 없다는 말. 갈래가 하나뿐이다 — 왜 없는지는 주석이 글로 말한다. */
function stateSpan() {
  return `<span class="miss empty">${NO_VALUE}</span>`;
}

// 그리지 못한 자리. 렌더는 멈추지 않고 자리를 표시하고 까닭을 적는다.
function undrawable(report, where, why, shown) {
  report.push(`${where}: ${why}`);
  return `<span class="undrawable" title="${esc(why)}">${UNDRAWABLE} — ${esc(shown ?? why)}</span>`;
}

function drawCell(report, where, decl, value) {
  const shown = formatValue(decl, value);
  if (shown === null) {
    return undrawable(report, where, `선언한 모양(${decl.shape ?? "없음"})과 값의 생김새가 다르다`, JSON.stringify(value));
  }
  return esc(shown);
}

// ---------------------------------------------------------------- primitive element 다섯

// ---------------------------------------------------------------- 비교하는 법 둘
//
// 순위 문법을 스키마에서 뺀 대신 **비교를 시각이 맡는다**(glossary §3.14 원칙 7).
// 다만 방법이 하나가 아니다 — **primitive element 마다 다르게 비교한다.**
//
// - **겹친다** (`line` · `list`) — 축이나 항목이라는 공유하는 자리가 있어 겹칠수록 읽을 것이 많아진다.
// - **focus 를 따라 바뀐다** (`stat` · `facts` · `bars`) — 겹칠 자리가 없어 억지로 늘어놓는 대신
//   **무엇을 그릴지 focus 가 고른다.** focus 가 강조 장치에서 고르는 자리로 커진다.
//
// **focus 가 없으면 첫 subject 를 그린다.** 늘어놓기로 돌아가지 않고, 빈 화면을 내지 않고,
// 무엇을 보고 있는지 이름으로 늘 말한다. 차례는 값 한 벌이 넘어온 차례이고 배치일 뿐 우열이 아니다.
const COMPARE = { stat: "focus", facts: "focus", bars: "focus", line: "overlay", list: "overlay" };

/** 값이 없어 자리에 못 선 subject. 겹치는 쪽에서 축 아래에 적는다. */
function blankRow(blanks) {
  if (blanks.length === 0) return "";
  const said = blanks
    .map((b) => `<span class="off${b.focused ? " is-focus" : ""}">` +
      `<b class="who">${esc(b.name)}</b> ${b.said}</span>`)
    .join("");
  return `<div class="offs">${said}</div>`;
}

function readsOf(ctx, facet, decl) {
  return ctx.subjects.map((subject) => ({
    subject: { ...subject, focused: subject.id === ctx.focus },
    ...cell(ctx.byId.get(subject.id), facet.id, decl.key),
  }));
}

function fieldNotes(reads) {
  return reads.map(({ subject, entry }) => notesHtml(entry?.notes, subject.name)).join("");
}

/** focus 를 따라 바뀌는 쪽이 지금 그리는 subject. 없으면 첫째다. */
function shownOf(ctx) {
  return ctx.subjects.find((s) => s.id === ctx.shown) ?? null;
}

function oneRead(ctx, facet, decl, subject) {
  return { subject, ...cell(ctx.byId.get(subject.id), facet.id, decl.key) };
}

// ---------------------------------------------------------------- primitive element 다섯

/** 값 하나를 크게. focus 가 고른 subject 의 것을 그린다. */
function stat(ctx, facet) {
  const decl = facet.fields[0];
  const subject = shownOf(ctx);
  if (!subject) return `<div class="blank">${stateSpan()}</div>`;
  const where = `${facet.id}/${decl.key}/${subject.id}`;
  const { state, entry } = oneRead(ctx, facet, decl, subject);
  const value = state === "filled" ? drawCell(ctx.report, where, decl, entry.value) : stateSpan();
  return (
    `<div class="field-label">${esc(decl.label ?? decl.key)}</div>` +
    `<div class="big">${value}${notePop(entry?.notes)}</div>`
  );
}

/** 라벨과 값 여럿. 한 facet 안에 타입이 섞여도 읽는 규칙은 하나다 — 고른 subject 의 것. */
function facts(ctx, facet) {
  const subject = shownOf(ctx);
  if (!subject) return `<div class="blank">${stateSpan()}</div>`;
  const rows = facet.fields.map((decl) => {
    const where = `${facet.id}/${decl.key}/${subject.id}`;
    const { state, entry } = oneRead(ctx, facet, decl, subject);
    const value = state === "filled" ? drawCell(ctx.report, where, decl, entry.value) : stateSpan();
    return (
      `<div class="fact"><dt>${esc(decl.label ?? decl.key)}</dt>` +
      `<dd>${value}${notePop(entry?.notes)}</dd></div>`
    );
  });
  return `<dl class="facts">${rows.join("")}</dl>`;
}

/** 크기 비교. **자는 subject 전체의 최대값으로 고정한다** — focus 를 옮겨도 길이를 견줄 수 있어야 한다. */
function bars(ctx, facet) {
  const subject = shownOf(ctx);
  if (!subject) return `<div class="blank">${stateSpan()}</div>`;
  const rows = facet.fields.map((decl) => {
    const all = readsOf(ctx, facet, decl)
      .filter((r) => r.state === "filled" && typeof r.entry.value === "number" && Number.isFinite(r.entry.value))
      .map((r) => r.entry.value);
    const top = all.length ? Math.max(...all) : 0;

    const where = `${facet.id}/${decl.key}/${subject.id}`;
    const { state, entry } = oneRead(ctx, facet, decl, subject);
    let mark = '<span class="track"></span>';
    let text;
    if (state !== "filled") {
      text = stateSpan();
    } else if (typeof entry.value === "number" && Number.isFinite(entry.value)) {
      const width = top > 0 && entry.value > 0 ? (entry.value / top) * 100 : 0;
      mark = `<span class="track"><span class="fill" style="width:${width.toFixed(4)}%"></span></span>`;
      text = esc(formatScalar(decl.type, entry.value));
    } else {
      text = undrawable(ctx.report, where, "막대는 수를 요구한다", JSON.stringify(entry.value));
    }
    return (
      `<div class="bar-row"><span class="who">${esc(decl.label ?? decl.key)}</span>${mark}` +
      `<span class="val">${text}${notePop(entry?.notes)}</span></div>`
    );
  });
  return rows.join("");
}

function line(ctx, facet) {
  const decl = facet.fields[0];
  const axis = decl.axis;
  const series = [];
  const misses = [];
  for (const subject of ctx.subjects) {
    const { state, entry } = cell(ctx.byId.get(subject.id), facet.id, decl.key);
    const where = `${facet.id}/${decl.key}/${subject.id}`;
    if (state !== "filled") {
      // 문장을 쓰지 않는다. **이름이 흐리게 남는 것**이 「이 자리에 못 그렸다」를 말한다.
      misses.push(
        `<span class="off${subject.id === ctx.focus ? " is-focus" : ""}">` +
          `<b class="who">${esc(subject.name)}</b>${notePop(entry?.notes)}</span>`,
      );
      continue;
    }
    const raw = entry.value;
    const points = [];
    let broken = null;
    if (!Array.isArray(raw)) broken = "선은 점의 배열을 요구한다";
    else
      for (const point of raw) {
        const x = axisNumber(axis, point?.at);
        const y = typeof point?.value === "number" && Number.isFinite(point.value) ? point.value : null;
        if (x === null || y === null) {
          broken = `축(${axis ?? "없음"})이나 값에 그릴 수 없는 것이 있다`;
          break;
        }
        points.push({ x, y, at: point.at });
      }
    if (broken || points.length === 0) {
      misses.push(
        `<span class="off${subject.id === ctx.focus ? " is-focus" : ""}">` +
          `<b class="who">${esc(subject.name)}</b> ` +
          `${undrawable(ctx.report, where, broken ?? "점이 하나도 없다", JSON.stringify(raw).slice(0, 80))}</span>`,
      );
      continue;
    }
    series.push({ subject, points, notes: entry.notes });
  }
  const body = series.length
    ? lineSvg(series, axis, decl.type, ctx.focus)
    : `<div class="blank">${stateSpan("empty")}</div>`;
  const notes = series
    .map(({ subject, notes: n }) => notesHtml(n, subject.name))
    .join("");
  return (
    `<div class="field-label">${esc(decl.label ?? decl.key)}</div>${body}` +
    (misses.length ? `<div class="offs">${misses.join("")}</div>` : "") +
    notes
  );
}

function lineSvg(series, axis, type, focus) {
  const W = 760, H = 240, L = 78, R = 130, T = 18, B = 34;
  const xs = series.flatMap((s) => s.points.map((p) => p.x));
  const ys = series.flatMap((s) => s.points.map((p) => p.y));
  const xmin = Math.min(...xs), xmax = Math.max(...xs);
  const ymin = Math.min(...ys, 0), ymax = Math.max(...ys);
  const xspan = xmax - xmin || 1;
  const yspan = ymax - ymin || 1;
  const px = (x) => L + ((x - xmin) / xspan) * (W - L - R);
  const py = (y) => H - B - ((y - ymin) / yspan) * (H - T - B);

  const firstAt = series.flatMap((s) => s.points).reduce((a, p) => (p.x < a.x ? p : a)).at;
  const lastAt = series.flatMap((s) => s.points).reduce((a, p) => (p.x > a.x ? p : a)).at;

  const parts = [
    `<line class="axis" x1="${L}" y1="${py(ymin).toFixed(1)}" x2="${W - R}" y2="${py(ymin).toFixed(1)}"/>`,
    `<line class="axis" x1="${L}" y1="${T}" x2="${L}" y2="${H - B}"/>`,
    `<text class="tick ty" x="${L - 8}" y="${py(ymax).toFixed(1)}">${esc(formatScalar(type, ymax))}</text>`,
    `<text class="tick ty" x="${L - 8}" y="${py(ymin).toFixed(1)}">${esc(formatScalar(type, ymin))}</text>`,
    `<text class="tick tx" x="${L}" y="${H - B + 18}">${esc(formatScalar(axis, firstAt))}</text>`,
    `<text class="tick tx end" x="${W - R}" y="${H - B + 18}">${esc(formatScalar(axis, lastAt))}</text>`,
  ];
  series.forEach(({ subject, points }, index) => {
    const focused = subject.id === focus;
    const klass = `series${focused ? " is-focus" : ""}`;
    if (points.length === 1) {
      parts.push(`<circle class="${klass}" cx="${px(points[0].x).toFixed(1)}" cy="${py(points[0].y).toFixed(1)}" r="3.5"/>`);
    } else {
      const dash = DASHES[index % DASHES.length];
      const coords = points.map((p) => `${px(p.x).toFixed(1)},${py(p.y).toFixed(1)}`).join(" ");
      parts.push(`<polyline class="${klass}" points="${coords}"${dash ? ` stroke-dasharray="${dash}"` : ""}/>`);
    }
    for (const p of points) {
      parts.push(`<circle class="dot ${klass}" cx="${px(p.x).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="2.5"/>`);
    }
    const last = points[points.length - 1];
    parts.push(
      `<text class="series-label${focused ? " is-focus" : ""}" x="${(px(last.x) + 8).toFixed(1)}" ` +
        `y="${(py(last.y) + 4).toFixed(1)}">${esc(subject.name)}</text>`,
    );
  });
  return `<svg class="line" viewBox="0 0 ${W} ${H}" role="img">${parts.join("")}</svg>`;
}

/**
 * 겹치는 좌표가 **항목**이다. subject 마다 표를 따로 두지 않고 목록을 하나로 합친다 —
 * 누가 무엇을 갖고 누가 안 갖는지가 한 줄에서 읽힌다.
 * 한 항목의 여러 열은 하나의 자로 줄일 수 없어 그 안에서만 나란히 선다 (원칙 9).
 */
function list(ctx, facet) {
  const decl = facet.fields[0];
  const columns = Array.isArray(decl.columns) ? decl.columns : [];
  if (columns.length === 0) return `<div class="blank">${stateSpan()}</div>`;
  const [key, ...rest] = columns;

  const reads = readsOf(ctx, facet, decl);
  const rows = new Map(); // 항목 이름 → subjectId → 항목
  const unread = new Set(); // 목록 자체를 못 읽은 subject
  for (const { subject, state, entry } of reads) {
    if (state !== "filled" || !Array.isArray(entry.value)) {
      unread.add(subject.id);
      continue;
    }
    for (const item of entry.value) {
      const name = item?.[key.key];
      if (name === undefined) continue;
      const at = String(name);
      if (!rows.has(at)) rows.set(at, new Map());
      rows.get(at).set(subject.id, item);
    }
  }

  const blanks = reads
    .filter(({ subject }) => unread.has(subject.id))
    .map(({ subject }) => ({ ...subject, said: stateSpan() }));
  if (rows.size === 0) {
    return `<div class="field-label">${esc(decl.label ?? decl.key)}</div>` +
      `<div class="blank"><span class="miss empty">${NO_ITEMS}</span></div>${blankRow(blanks)}${fieldNotes(reads)}`;
  }

  const head = [`<th class="corner">${esc(key.label ?? key.key)}</th>`];
  for (const { subject } of reads) {
    head.push(
      `<th${subject.focused ? ' class="is-focus"' : ""}>${esc(subject.name)}</th>`,
    );
  }
  const body = [...rows.entries()].map(([name, held]) => {
    const cells = reads.map(({ subject }) => {
      if (unread.has(subject.id)) return `<td>${stateSpan()}</td>`;
      const item = held.get(subject.id);
      if (!item) return '<td><span class="miss">없음</span></td>';
      const pairs = rest.map((column) =>
        column.key in item
          ? `<span class="cell-pair"><b class="who">${esc(column.label ?? column.key)}</b> ${esc(formatScalar(column.type, item[column.key]))}</span>`
          : "",
      );
      const extra = Object.keys(item).filter((k) => !columns.some((c) => c.key === k));
      if (extra.length) ctx.report.push(`${facet.id}/${name}: 템플릿에 없는 열이라 그리지 않았다 — ${extra.join(", ")}`);
      return `<td class="${subject.focused ? "is-focus" : ""}">${pairs.join("") || "<span class=\"miss\">있음</span>"}</td>`;
    });
    return `<tr><th class="row-label" scope="row">${esc(name)}</th>${cells.join("")}</tr>`;
  });

  return (
    `<div class="field-label">${esc(decl.label ?? decl.key)}</div>` +
    // **표만 옆으로 굴린다.** subject 가 늘수록 넓어지는 유일한 자리라, 페이지 전체가 밀리는
    // 대신 표가 자기 상자 안에서 굴러간다. 열 너비는 균일하다 — 넓이가 우열을 말하지 않는다.
    `<div class="table-scroll"><table class="items"><thead><tr>${head.join("")}</tr></thead>` +
    `<tbody>${body.join("")}</tbody></table></div>` +
    // 문장을 덧붙이지 않는다 — 그 subject 의 칸이 이미 「값 없음」이라고 말한다.
    fieldNotes(reads)
  );
}

const ELEMENTS = { stat, facts, bars, line, list };

// ---------------------------------------------------------------- 페이지

/** 뷰어가 왼쪽에 적을 것. **분석뷰에 섞이지 않는다.** 자리 계산이 두 벌이 되지 않게 여기서 낸다. */
function viewState(seats, focus, shown, wanted) {
  return {
    seats,
    shown, // focus 를 따라 바뀌는 element 가 지금 그리는 subject

    focus,
    // 없는 id 는 결함이 아니다. 분석뷰는 focus 를 놓은 것과 똑같고, 그 사실만 왼쪽이 알린다.
    focusMissing: wanted && !focus ? wanted : null,
  };
}

/**
 * 분석뷰 하나를 HTML 로 그린다.
 *
 * @param {object} input  { template, values, focus }
 *   - 자리와 그 차례는 **값 한 벌들이 정한다.** 명단을 따로 받지 않는다.
 *   - focus 는 subject 의 id. null 이거나 없는 id 면 겹치는 element 는 강조를 풀고,
 *     focus 를 따라 바뀌는 element 는 **첫 subject** 를 그린다.
 * @returns {{html: string, report: string[], view: object|null}}
 *   html 은 **분석뷰뿐**이다 — 템플릿 제목과 facet 들. 도구가 덧붙이는 것은 하나도 들어가지 않는다.
 *   report 는 그리지 못한 자리들, view 는 뷰어가 왼쪽에 적을 화면 상태.
 */
function renderView({ template, values = [], focus = null } = {}) {
  const report = [];
  if (!template || typeof template !== "object" || Array.isArray(template)) {
    // 그릴 분석뷰가 없다. 빈 판을 내고 무슨 일인지는 왼쪽이 말한다.
    return { html: "", report: ["템플릿이 객체가 아니다"], view: null };
  }
  const byId = new Map();
  for (const doc of values) {
    if (doc && typeof doc === "object" && typeof doc.subjectId === "string") byId.set(doc.subjectId, doc);
    else report.push("값 한 벌에 subjectId 가 없어 어느 subject 인지 알 수 없다");
    if (doc?.templateId && template.id && doc.templateId !== template.id) {
      report.push(`${doc.subjectId}: 값 한 벌의 templateId 가 템플릿과 다르다 (${doc.templateId} ≠ ${template.id})`);
    }
  }

  // 자리는 값 한 벌들이 정한다. 차례는 넘어온 차례이고 배치일 뿐 우열이 아니다.
  // **자리에 색을 붙이지 않는다.** subject 를 가르는 것은 이름이고, 겹치는 선은 무늬다.
  const seats = [...byId.entries()].map(([id, doc]) => ({ id, name: doc.subjectLabel || id }));

  const wanted = focus;
  const seated = seats.some((s) => s.id === wanted) ? wanted : null;
  // focus 를 따라 바뀌는 element 가 그릴 subject. 고른 것이 없으면 첫째다 —
  // 늘어놓기로 돌아가지 않고 빈 화면도 내지 않는다.
  const shown = seated ?? seats[0]?.id ?? null;
  const ctx = { subjects: seats, byId, focus: seated, shown, report };

  for (const [id, doc] of byId) {
    const known = new Set((template.facets ?? []).map((f) => f?.id));
    for (const key of Object.keys(doc.facets ?? {})) {
      if (!known.has(key)) report.push(`${id}: 템플릿에 없는 facet 이라 그리지 않았다 — ${key}`);
    }
  }

  const facets = Array.isArray(template.facets) ? template.facets : [];
  if (facets.length === 0) report.push("템플릿에 facet 이 하나도 없다");

  const sections = facets.map((facet, index) => {
    const at = `facets[${index}]`;
    if (!facet || typeof facet !== "object") {
      return `<section class="facet broken">${undrawable(report, at, "facet 이 객체가 아니다")}</section>`;
    }
    const title = esc(facet.title ?? facet.id ?? at);
    const draw = ELEMENTS[facet.element];
    // primitive element 이름은 분석뷰에 나올 자리가 없다. 구조로만 남긴다 —
    // 참조 뷰어의 배지는 이 속성을 읽어 CSS 가 그리므로 렌더가 낸 글에는 들어가지 않는다.
    const head = `<h2 data-element="${esc(facet.element ?? "")}">${title}</h2>`;
    let body;
    if (!draw) {
      body = undrawable(report, facet.id ?? at, `모르는 primitive element 다 — ${JSON.stringify(facet.element)}`);
    } else if (!Array.isArray(facet.fields) || facet.fields.length === 0) {
      body = undrawable(report, facet.id ?? at, "필드가 하나도 없다");
    } else if (facet.fields.some((f) => !f || typeof f.key !== "string")) {
      body = undrawable(report, facet.id ?? at, "key 가 없는 필드가 있다");
    } else {
      body = draw(ctx, facet);
    }
    // **말은 데이터 뒤에 선다.** facet 에 붙은 것과 subject 에 붙은 것이 한자리에 모인다 —
    // 예외를 두지 않는다. 읽는 규칙이 둘이면 매번 어디 있는지 찾게 된다.
    // 둘을 가르는 것은 띠도 상자도 아니고 **자리와 글**이다: subject 것은 이름이 앞에 선다.
    //
    // **그리는 것과 말이 맞아야 한다** — 겹치는 쪽은 전원의 말을, focus 를 따라 바뀌는 쪽은
    // **그리고 있는 subject 의 말만** 낸다. 보이지도 않는 subject 의 말은 무엇에 대한 말인지 알 수 없다.
    const speaking = COMPARE[facet.element] === "focus" ? seats.filter((s) => s.id === shown) : seats;
    const said =
      notesHtml(facet.notes) +
      speaking.map((s) => notesHtml(facetNotes(byId.get(s.id), facet.id), s.name)).join("");
    return (
      `<section class="facet element-${esc(facet.element ?? "unknown")}">${head}` +
      `<div class="body">${body}</div>` +
      (said ? `<div class="said">${said}</div>` : "") +
      "</section>"
    );
  });

  // 제목은 템플릿이 선언한 내용이라 렌더의 것이다. 그 밖의 머리말은 전부 뷰어 몫이다.
  const html = `<h1>${esc(template.title ?? template.id ?? "제목 없음")}</h1>` + sections.join("");

  return { html, report, view: viewState(seats, seated, shown, wanted) };
}

// weave 설명서. 이 한 장이 설명서이고 플레이그라운드는 그 안의 한 자리다.
//
// 왼쪽에 목차, 가운데에 본문. element 쪽 본문은 제약과 최소 템플릿 조각과 **그 자리에서 그린 모습**이다.
// 목차의 정본은 카탈로그다 — primitive element 가 늘거나 줄면 목차가 따라 바뀐다.
//
// **판정하지 않는다.** JSON 으로 읽히는지만 보고 스키마 판정은 Python 검사기가 갖는다.


const $ = (id) => document.getElementById(id);

// 목차의 primitive element 표시. **구조를 가리킬 뿐 도메인을 가리키지 않는다** —
// 돈·병원·서류 같은 그림을 두지 않는다. 다섯이 같은 크기·같은 선 굵기다.
function elementIcon(id) {
  const body = ICON[id];
  if (!body) return "";
  return `<svg class="toc-icon" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">${body}</svg>`;
}
const pretty = (doc) => JSON.stringify(doc, null, 2);

const state = {
  page: PAGES[0].id,
  sample: null,
  templateText: "", // 템플릿 하나. 모든 값이 여기 매인다
  values: [], // 값 한 벌들의 글. **subject 마다 정확히 하나이고 이것이 곧 명단이다**
  active: 0, // 0 은 템플릿, 1 부터는 values 의 자리
  focus: null,
  seq: 0,
  showElements: false, // primitive element 이름. 분석뷰의 것이 아니라 설명서의 것이라 기본은 끔
};

const pageOf = (id) => PAGES.find((p) => p.id === id) ?? PAGES[0];

// ---------------------------------------------------------------- 목차

function drawToc() {
  const toc = $("toc");
  toc.innerHTML = "";
  let group = null;
  for (const page of PAGES) {
    if (page.group !== group) {
      group = page.group;
      const head = document.createElement("div");
      head.className = "group";
      head.textContent = group;
      toc.appendChild(head);
    }
    const link = document.createElement("button");
    link.type = "button";
    link.className = page.kind === "element" ? "toc-link has-icon" : "toc-link";
    link.innerHTML = `${elementIcon(page.id)}${escapeText(page.title)}`;
    link.setAttribute("aria-pressed", String(page.id === state.page));
    link.addEventListener("click", () => {
      state.page = page.id;
      draw();
    });
    toc.appendChild(link);
  }
}

// ---------------------------------------------------------------- 설명서 본문

function guidePage(page) {
  return (
    `<header class="page-head"><h1>${esc(page.title)}</h1><p class="lead">${esc(page.lead)}</p></header>` +
    page.paragraphs.map((p) => `<p>${esc(p)}</p>`).join("")
  );
}

function elementPage(page) {
  const draw = (focus) => renderView({ template: page.demo.template, values: page.demo.values, focus }).html;
  const types = page.everyType
    ? `${page.types.length} 가지 전부`
    : page.types.map((t) => `<code>${esc(t)}</code>`).join(" · ");

  // focus 를 따라 바뀌는 것은 정지 화면 하나로 못 보인다. 고른 것을 달리한 두 장을 나란히 둔다.
  const shots =
    page.compare === "focus"
      ? page.demo.values
          .map((doc) => {
            const who = doc.subjectLabel || doc.subjectId;
            return `<div class="shot"><div class="shot-said">고른 것 — ${esc(who)}</div>` +
              `<div class="demo">${draw(doc.subjectId)}</div></div>`;
          })
          .join("")
      : `<div class="demo">${draw(null)}</div>`;

  return (
    `<header class="page-head"><h1><code>${esc(page.title)}</code></h1>` +
    `<p class="lead">${esc(page.draws)}</p></header>` +
    `<dl class="limits">` +
    `<dt>비교</dt><dd>${esc(page.compareSaid)}</dd>` +
    `<dt>필드 수</dt><dd>${esc(page.fields)}</dd>` +
    `<dt>shape</dt><dd>${page.shapes.map((x) => `<code>${esc(x)}</code>`).join(" · ")}</dd>` +
    `<dt>type</dt><dd>${types}</dd>` +
    `</dl>` +
    `<p class="note-line">${esc(page.note)}</p>` +
    `<h2>그려진 모습</h2>${shots}` +
    `<h2>그것을 만든 템플릿</h2>` +
    `<pre>${esc(JSON.stringify(page.demo.template.facets[0], null, 2))}</pre>`
  );
}

// ---------------------------------------------------------------- 플레이그라운드
//
// **탭은 값 한 벌마다 하나다.** subject 마다 값 한 벌이 정확히 하나 있으므로 탭이 곧 subject 다.
// 값 한 벌이 없는 subject 라는 것이 없으니 자리와 값을 가르던 상태도 없다.
// 아직 분석하지 않았다는 것은 **전부 비어 있는 값 한 벌과 주석**이 말한다.

function loadSample(key) {
  const sample = SAMPLES[key];
  state.sample = key;
  state.templateText = sample.template;
  state.values = sample.values.map((v) => v.text);
  state.focus = sample.args.focus ?? null;
  state.active = 0;
  state.seq = state.values.length;
  // 플레이그라운드의 DOM 은 쪽을 보고 있지 않아도 채워 둔다 — 옮겨 가도 편집 중인 글이 산다.
  drawTabs();
  drawEditor();
  refresh();
}

function parse(text) {
  try {
    return { doc: JSON.parse(text), error: null };
  } catch (exc) {
    return { doc: null, error: exc.message };
  }
}

/** 탭 이름. 값 한 벌이 스스로 말한다 — 명단을 따로 두지 않는다. */
function nameOf(text, index) {
  const { doc } = parse(text);
  return doc?.subjectLabel || doc?.subjectId || `값 한 벌 ${index + 1}`;
}

function read() {
  const problems = [];
  const take = (label, text) => {
    if (!text || text.trim() === "") return null;
    const { doc, error } = parse(text);
    if (error) problems.push(`${label}: JSON 으로 읽지 못했다 — ${error}`);
    return doc;
  };
  const template = take("템플릿", state.templateText);
  const values = [];
  state.values.forEach((text, index) => {
    const doc = take(nameOf(text, index), text);
    if (doc) values.push(doc);
  });
  return { template, values, problems };
}

function escapeText(text) {
  const node = document.createElement("span");
  node.textContent = text;
  return node.innerHTML;
}

function stash() {
  if (state.active === 0) state.templateText = $("editor").value;
  else state.values[state.active - 1] = $("editor").value;
}

function drawTabs() {
  const bar = $("tabs");
  bar.innerHTML = "";
  const tabs = [
    { name: "템플릿", text: state.templateText, template: true },
    ...state.values.map((text, index) => ({ name: nameOf(text, index), text, template: false })),
  ];
  tabs.forEach((tab, index) => {
    const button = document.createElement("button");
    button.className = tab.template ? "tab tab-template" : "tab tab-subject";
    button.type = "button";
    button.setAttribute("aria-pressed", String(index === state.active));
    const broken = tab.text && tab.text.trim() !== "" && parse(tab.text).error;
    button.innerHTML = `${escapeText(tab.name)}${broken ? ' <span class="bad">!</span>' : ""}`;
    button.addEventListener("click", () => {
      stash();
      state.active = index;
      drawTabs();
      drawEditor();
    });
    bar.appendChild(button);
  });
}

function drawEditor() {
  const editor = $("editor");
  editor.value = state.active === 0 ? state.templateText : state.values[state.active - 1];
  editor.setAttribute("aria-label", state.active === 0 ? "템플릿" : nameOf(editor.value, state.active - 1));
}

/** focus 를 짧게 나열한다. 항목은 none 과 각 subject 의 이름이다. */
function drawFocus(seats) {
  const box = $("focus-buttons");
  box.innerHTML = "";
  // 이름만 선다. subject 를 색으로 가르지 않으므로 색 조각을 앞에 두지 않는다.
  const add = (label, value, title) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "pick";
    button.textContent = label;
    if (title) button.setAttribute("title", title);
    button.setAttribute("aria-pressed", String(state.focus === value));
    button.addEventListener("click", () => {
      state.focus = value;
      refresh();
    });
    box.appendChild(button);
  };
  add("none", null, "아무도 고르지 않음 — 겹치는 것은 강조를 풀고, 고르는 것은 첫 subject 로 돌아간다");
  for (const seat of seats) add(seat.name, seat.id, seat.id);
}

function refresh() {
  const { template, values, problems } = read();
  const { html, report, view } = renderView({ template, values, focus: state.focus });
  // 오른쪽 판은 분석뷰뿐이다. 이름표는 CSS 가 붙이므로 렌더가 낸 글은 그대로다.
  $("view").className = state.showElements ? "viewport show-elements" : "viewport";
  $("view").innerHTML = html;
  drawFocus(view?.seats ?? []);
  // 무엇을 보고 있는지는 화면에 한 번. 고른 것이 있으면 눌린 버튼이 이미 말하므로,
  // 말해 주지 못할 때(고른 것 없음)만 적는다.
  const watching = (view?.seats ?? []).find((s) => s.id === view?.shown);
  $("watching").innerHTML =
    watching && state.focus === null ? `보는 중 <b>${escapeText(watching.name)}</b>` : "";

  const all = [...problems, ...report];
  const strip = $("strip");
  strip.innerHTML = all.length
    ? `<b>렌더가 그리지 못한 자리 ${all.length}</b><ul>${all.map((l) => `<li>${escapeText(l)}</li>`).join("")}</ul>`
    : "";
  drawTabs();
}

// ------------------------------------------------ subject 를 더하고 빼는 것은 화면의 동작이다

/** 더하는 것도 지우는 것도 subject 하나뿐이다. 더할 때 값 한 벌은 **전부 비어** 있다. */
function addSubject() {
  stash();
  const { doc } = parse(state.templateText);
  state.seq += 1;
  const id = `subject-${state.seq}`;
  const blank = { weave: "1", templateId: doc?.id ?? "", subjectId: id, subjectLabel: id, facets: {} };
  for (const facet of doc?.facets ?? []) {
    blank.facets[facet.id] = {
      fields: Object.fromEntries((facet.fields ?? []).map((f) => [f.key, { state: "empty" }])),
      notes: [{ kind: "caution", text: "아직 분석하지 않았습니다." }],
    };
  }
  state.values.push(pretty(blank));
  state.active = state.values.length;
  drawTabs();
  drawEditor();
  refresh();
}

function dropSubject() {
  stash();
  const index = state.active === 0 ? state.values.length - 1 : state.active - 1;
  if (index < 0) return;
  const { doc } = parse(state.values[index]);
  if (doc?.subjectId && state.focus === doc.subjectId) state.focus = null;
  state.values.splice(index, 1);
  if (state.active > state.values.length) state.active = state.values.length;
  drawTabs();
  drawEditor();
  refresh();
}

// ---------------------------------------------------------------- 그리기

function draw() {
  const page = pageOf(state.page);
  const playing = page.kind === "playground";
  $("page").hidden = playing;
  $("playground").hidden = !playing;
  if (playing) {
    $("pg-title").textContent = page.title;
    $("pg-lead").textContent = page.lead;
    drawTabs();
    drawEditor();
    refresh();
  } else {
    $("page").innerHTML = page.kind === "element" ? elementPage(page) : guidePage(page);
  }
  drawToc();
}

let timer = null;
function scheduleRefresh() {
  stash();
  clearTimeout(timer);
  timer = setTimeout(refresh, 140);
}

function start() {
  const picker = $("sample");
  for (const [key, sample] of Object.entries(SAMPLES)) {
    const option = document.createElement("option");
    option.value = key;
    option.textContent = sample.name;
    picker.appendChild(option);
  }
  picker.addEventListener("change", () => loadSample(picker.value));
  $("editor").addEventListener("input", scheduleRefresh);

  // 붙은 말은 초점을 받으면 열린다(CSS). 닫는 길 둘 — 닫기 단추와 Esc.
  $("view").addEventListener("click", (event) => {
    const close = event.target.closest?.(".pop-close");
    if (close) close.closest(".note-mark")?.blur();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") document.activeElement?.closest?.(".note-mark")?.blur();
  });
  $("add-subject").addEventListener("click", addSubject);
  $("drop-subject").addEventListener("click", dropSubject);
  $("show-elements").addEventListener("change", (event) => {
    state.showElements = Boolean(event.target.checked);
    refresh();
  });

  const first = Object.keys(SAMPLES)[0];
  picker.value = first;
  loadSample(first);
  draw();
}

start();
</script>
</body>
</html>
