<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>weave 설명서</title>
<!--
  이 파일은 tools/build_viewer.py 가 viewer/ · samples/ · catalog/ 에서 만든다. 손으로 고치지 않는다.
  의존성이 없다 — CDN 도 서버도 쓰지 않는다. 파일을 브라우저로 열면 바로 돈다.
-->
<style>
/* 설명서의 시각.
 *
 * 규칙 넷 — 취향이 아니라 이 저장소가 서 있는 이유다.
 *   1. **색은 주석 갈래에서만 나온다.** subject 도 값도 색으로 가르지 않는다 —
 *      가르는 것은 이름·무늬·굵기·크기·여백이다.
 *   2. 순위·등급·경고를 시각으로 되살리지 않는다. 주석 갈래의 색은 통용 시맨틱이지 심각도 순위가 아니다.
 *   3. 렌더 출력에 도구 껍데기가 없다.
 *   4. 파일 하나로 열린다. 웹폰트도 네트워크를 타지 않으므로 시스템 글꼴로 간다.
 *
 * **띠와 상자로 말하던 것을 글자로 말하게 한다.** 테두리·채움·모서리는 각각 별개의 물건이라는
 * 뜻이므로 역할을 보고만 쓴다. radius 는 한 값뿐이고 진짜 컨테이너에만 붙는다.
 */

:root {
  /* 이 한 장은 밝은 바탕으로 짜였다. 기기가 어두운 쪽으로 기울여 읽지 않게 못 박는다 —
     밖에서 덧대던 줄을 여기로 들였다. */
  color-scheme: light;

  --ink:#1a1a1a;       /* 본문 */
  --mute:#6b6b6b;      /* 딸린 말 */
  --line:#d9d9d9;      /* 구조선 */
  --surface:#f6f6f6;   /* 옅은 면 */
  --r:3px;             /* 하나뿐인 모서리. 진짜 컨테이너에만 */

  /* **세로 리듬은 자 셋에서만 나온다.** 값이 제각각이면 어디서 끊기는지 눈이 못 읽는다.
     한 자를 고치면 그 층 전체가 함께 움직인다. */
  --row:6px;           /* 줄과 줄 — 주석 한 줄 다음 줄, 묶음과 묶음도 같은 값이다 */
  --step:14px;         /* 한 facet 안의 층 — 제목·본문·말 */
  --gap:30px;          /* facet 과 facet — 선이 그 한가운데 선다 */
}

/* list 한 칸 안의 열들. 한 항목의 여러 열은 하나의 자로 줄일 수 없어 그 안에서만 나란히 선다. */
.cell-pair { display:block; font-size:13px; }
.cell-pair .who { font-weight:400; color:var(--mute); margin-right:4px; }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; color:var(--ink); background:#ffffff;
  font:15px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }

/* ---------------------------------------------------------------- 설명서의 뼈대 */

.site { display:grid; grid-template-columns:216px 1fr; height:100%; }
.nav { border-right:1px solid var(--line); overflow:auto; padding-bottom:24px; background:var(--surface); }
.brand { font-size:14px; font-weight:700; letter-spacing:.02em; padding:16px 18px 12px; }
.nav .group { font-size:11px; color:var(--mute); padding:16px 18px 4px; letter-spacing:.04em; }
.toc-link { display:block; width:100%; text-align:left; border:none; background:none;
  padding:5px 18px; font:inherit; font-size:13.5px; color:var(--mute); cursor:pointer; }
.toc-link:hover { color:var(--ink); }
.toc-link.has-icon { display:flex; align-items:center; gap:9px; }
/* primitive element 표시. 구조를 가리킬 뿐 도메인을 가리키지 않는다. 다섯이 같은 무게다. */
.toc-icon { flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:1.3;
  stroke-linecap:round; opacity:.75; }
.toc-link[aria-pressed="true"] .toc-icon { opacity:1; }
/* 고른 것은 굵기로 말한다. 왼쪽 띠를 대지 않는다. */
.toc-link[aria-pressed="true"] { color:var(--ink); font-weight:700; background:var(--surface); }

.content { min-width:0; min-height:0; overflow:auto; }
.page { max-width:720px; padding:36px 32px 96px; margin:0 auto; }
.page-head { margin-bottom:20px; }
h1 { font-size:26px; margin:0 0 10px; letter-spacing:-.015em; }
h1 code { font-size:25px; }
.lead { font-size:15px; color:var(--mute); margin:0; max-width:62ch; }
.page p { max-width:68ch; }
.page > h2 { font-size:12px; color:var(--mute); font-weight:600; margin:32px 0 10px;
  display:block; letter-spacing:.04em; }
code { font:12px ui-monospace,SFMono-Regular,Menlo,monospace; }
.limits { display:grid; grid-template-columns:max-content 1fr; gap:4px 16px; margin:20px 0 0; font-size:13.5px; }
.limits dt { color:var(--mute); }
.limits dd { margin:0; }
.note-line { font-size:13.5px; color:var(--mute); margin:12px 0 0; max-width:68ch; }
/* 코드는 회색 상자가 아니라 글꼴로 갈린다 */
pre { margin:0; padding:0; overflow-x:auto; color:var(--ink);
  font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace; }
/* 산 렌더와 산문 사이는 진짜 경계라 틀이 하나 선다 */
.demo { border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; }
/* focus 를 따라 바뀌는 element 는 고른 것을 달리한 두 장으로 보인다 */
.shot + .shot { margin-top:14px; }
.shot-said { font-size:11px; color:var(--mute); margin-bottom:6px; letter-spacing:.03em; }
.demo h1 { font-size:11px; color:var(--mute); font-weight:600; margin:0 0 10px; letter-spacing:.04em; }
.demo .facet, .demo .facet:first-of-type { border-top:none; padding:0; }

/* ---------------------------------------------------------------- 플레이그라운드 */

.playground { display:flex; flex-direction:column; height:100%; }
.playground[hidden] { display:none; }
.playground .page-head { padding:24px 28px 14px; margin:0; }
.playground h1 { font-size:19px; }
.panes { display:grid; grid-template-columns:minmax(320px, 44%) 1fr; flex:1; min-height:0;
  border-top:1px solid var(--line); }
.pane { min-width:0; min-height:0; display:flex; flex-direction:column; }
.pane.edit { border-right:1px solid var(--line); }
/* 판은 스크롤하지 않는다. 띠는 붙박이로 두고 본문만 굴린다 —
   띄우는 방식이 아니라 구조로 가른 자리다. */
.pane.view { overflow:hidden; }
.scroll { flex:1; min-height:0; overflow:auto; }
.viewport { padding:28px 28px 72px; max-width:880px; margin:0 auto; }

.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  padding:10px 14px; border-bottom:1px solid var(--line); }
.bar .push { margin-left:auto; }
select, button { font:inherit; font-size:13px; color:var(--ink);
  background:#ffffff; border:1px solid var(--line); border-radius:var(--r); padding:4px 9px; }
button { cursor:pointer; }
button:hover { background:var(--surface); }
button[aria-pressed="true"] { background:var(--ink); color:#ffffff; border-color:var(--ink); }
/* focus 나열. 항목에 none 이 있어 무엇을 고르는 줄인지 스스로 읽힌다 — 라벨을 두지 않는다. */
#focus-buttons { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
button.pick { padding:3px 10px; font-size:12.5px; }
label { font-size:12px; color:var(--mute); }
label:has(input) { display:inline-flex; align-items:center; gap:5px; }

/* 탭은 고른 것을 **굵기와 색조**로 말한다. 밑줄도 상자도 두르지 않는다 —
   밑줄로 활성을 말하는 것은 왼쪽 띠를 아래로 옮긴 것뿐이다.
   `.tabs` 의 아래 선은 활성 표시가 아니라 편집기와의 판 구분선이다. */
.tabs { display:flex; flex-wrap:wrap; gap:2px; align-items:stretch;
  padding:0 10px; border-bottom:1px solid var(--line); }
.tab { border:none; background:none; padding:9px 10px; font-size:12.5px; color:var(--mute); }
.tab:hover { background:none; color:var(--ink); }
.tab[aria-pressed="true"] { background:none; color:var(--ink); font-weight:700; }
.tab .bad { font-weight:700; }
/* 탭 하나가 곧 subject 다. 템플릿은 하나뿐이라 홀로 앞에 서고, 사이를 자리(간격)가 가른다.
   묶는 말을 두지 않는다 — 탭이 이미 subject 인데 그 위에 또 적으면 같은 말을 두 번 한다. */
.tab-slot { display:inline-flex; align-items:stretch; }
/* 템플릿은 subject 가 아니다 — 자리(간격)가 그것을 가른다. */
.tab-slot:has(.tab-template) { margin-right:16px; }
/* **닫는 자리는 지금 고른 탭에만 선다.** 폭은 28px 로 44px 에 못 미치지만 높이는 줄 전체를
   채운다 — 닫기는 되돌릴 수 없어 후보를 하나로 줄이는 쪽을 골랐다. 표시(ⓘ)와 같은 맞바꿈이다. */
.tab-x, .tab-add { border:none; background:none; color:var(--mute);
  padding:0; width:28px; align-self:stretch; font-size:14px; line-height:1; }
.tab-x:hover, .tab-add:hover { background:none; color:var(--ink); }
.tab-add { margin-left:6px; }

textarea { flex:1; width:100%; margin:0; border:none; padding:14px;
  resize:none; background:#ffffff; color:var(--ink);
  font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; tab-size:2; }
textarea:focus { outline:2px solid var(--ink); outline-offset:-2px; }
.strip { border-top:1px solid var(--line); padding:10px 14px;
  font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; max-height:26vh; overflow:auto; }
.strip:empty { display:none; }
.strip b { display:block; margin-bottom:4px; }
.strip ul { margin:0; padding-left:16px; }
.strip li { color:var(--ink); }

/* ---------------------------------------------------------------- 분석뷰 */

h2 { font-size:17px; margin:0 0 10px; display:flex; align-items:baseline; gap:8px; letter-spacing:-.01em; }
/* primitive element 이름은 **분석뷰 옆에 늘 선다.** 설명서가 쪽마다 원소를 설명하므로
   facet 마다 이름이 서면 둘이 이어진다. 알약이 아니라 작은 글이다.
   **렌더 출력에는 들어가지 않는다** — CSS 가 `data-element` 를 읽어 붙인다. */
.viewport h2[data-element]::after { content:attr(data-element);
  font:11px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--mute); font-weight:400; }
/* focus 는 색이 아니라 테두리와 굵기로 말한다.
   **표에서는 열을 통째로 잡는다** — 칸마다 두르면 열 안에 가로선이 생겨 한 덩어리로
   읽히지 않는다. 열 선언에 준 테두리는 `border-collapse` 가 머리부터 끝까지 한 상자로 잇는다. */
col.is-focus { border:2px solid var(--ink); }
.is-focus > .who { font-weight:700; }
/* **facet 이 타는 축의 선택자.** 렌더가 자리를 내고 앱이 제 것으로 갈아 끼운다 —
   참조 뷰어는 단추로 그린다. 꼴을 가리키는 이름을 붙이지 않는다. */
.choice { display:flex; flex-wrap:wrap; gap:6px; margin-top:var(--step); }
.choice button { font-size:12.5px; padding:4px 10px; }

/* **선은 두 facet 의 한가운데 선다.** 위 여백은 앞 facet 의 아래 여백이고 아래 여백은
   이 facet 의 위 여백이라, 둘이 같아야 선이 가운데로 온다 — 그래서 한 자로 적는다. */
.facet { border-top:1px solid var(--line); padding:var(--gap) 0; }
/* 첫 facet 위에는 선이 없다. 그래도 제목이 분석뷰 제목에 붙지 않게 한 층을 띄운다. */
.facet:first-of-type { border-top:none; padding-top:var(--step); }
.facet h2 { margin-bottom:0; }
/* **제목 아래 늘 보이는 한 줄.** 이 자리가 무엇인지 말한다 — 제목은 이름만 진다. */
.facet-hint { margin:var(--row) 0 0; font-size:13px; color:var(--mute); max-width:68ch; }
.body { margin-top:var(--step); }
.field-label { font-size:12.5px; color:var(--mute); margin-bottom:8px; }
/* **늘 보이는 한 줄.** 값이 무엇인지 그 자리에서 말한다 — 표시 뒤로 숨지 않는다.
   딸린 말이라 작고 흐리게 서고, 값보다 앞에 나서지 않는다. */
/* **이름 옆 표시가 열면 나오는 한 줄.** 늘 보이면 계약 표가 값보다 설명으로 길어진다 —
   읽고 싶을 때 연다. 여는 길은 값 주석과 같은 것을 쓴다. */
.hint { margin:0; font-size:12.5px; color:var(--ink); }
/* facts 는 줄이 촘촘해 딸린 말이 다음 줄 것처럼 읽히기 쉽다 — 값에 붙이고 아래를 띄운다. */
.who { font-size:12.5px; color:var(--mute); }
/* 없다는 **표기**. 값이 설 자리에 서서 「여기에 값이 없다」를 말한다 —
   빈 칸으로 두면 렌더가 깨진 것과 구별되지 않는다. 뜻은 이름표가 글로 갖는다. */
.miss { font-size:12.5px; color:var(--mute); }
.miss.value { cursor:help; }
/* **아직 아무도 오지 않은 자리 — 여기가 굴린다.**

   산출물(renderView)은 표식만 낸다: `.slot` 과 그 안의 릴 `<i>`, 그리고 `.sweep`.
   시간도 프레임도 애니메이션 지시도 산출물에는 한 글자 없다. **움직임은 전부 이 파일의 것**이라
   앱은 같은 표식 위에 제 방식을 얹으면 된다. 「산출물에 디자인이 없다」가 그대로 선다.

   왜 도는가. 정지한 회색 0 은 이 도메인에서 **진짜 값**으로 읽힌다 — 미보장이 0원이다.
   도는 숫자는 멈춰 있지 않아 값으로 읽힐 수가 없고, 이 자리는 진짜로 「곧 옵니다」가 맞는
   순간이다. 움직임이 오히려 정직한 쪽이다.

   무엇을 말하지 않는가. **모든 자리가 같은 속도로 돈다** — 어느 자리가 더 빨리 돌면 그것이
   강조다. 한 자리 안의 릴만 위상을 어긋내고(속도가 아니라 시작점), 릴 수는 **타입마다 고정**이라
   자릿수가 크기를 말하지 않는다. */
.slot { --reel:1.15em; --spin:2800ms; --cell:.62em; --type:6750ms;
  display:inline-flex; gap:1px; align-items:center; vertical-align:-.18em;
  height:var(--reel); max-width:100%; }
/* **잘린 글리프를 보이지 않는다.** 칸을 세 줄 높이로 잡아 위아래로 넘치게 두고(바깥 여백을
   음수로 되돌려 줄 높이는 그대로다) 가장자리를 마스크로 지운다 — 숫자가 위아래로 흐리게
   나타났다 사라진다. 자르는 것과 사라지는 것이 다르다. */
.slot i { display:block; height:calc(var(--reel) * 2); margin-block:calc(var(--reel) * -.5);
  overflow:hidden; font-style:normal;
  -webkit-mask-image:linear-gradient(to bottom, transparent 18%, #000 50%, transparent 82%);
  mask-image:linear-gradient(to bottom, transparent 18%, #000 50%, transparent 82%); }
/* **transform 하나만 움직인다.** 층을 미리 잡아 두어 글자를 매 프레임 다시 그리지 않는다 —
   마스크가 걸린 자리라 그러지 않으면 메인 스레드가 글자를 계속 다시 앉히고, 그것이 버벅임이다.
   속도도 늦췄다. 한 자리에 110ms 는 읽히지도 않으면서 눈만 어지럽다. */
.slot i::before { display:block; line-height:var(--reel); text-align:center;
  padding-top:calc(var(--reel) * .5); color:var(--ink); will-change:transform;
  animation:reel var(--spin) linear infinite var(--phase); }

/* **줄마다 시작점을 어긋낸다.** 안 그러면 모든 줄의 릴이 한 박자로 돌아 같은 숫자가 나란히
   서고, 그것이 「값이 전부 같다」로 읽힌다. 바꾸는 것은 시작점뿐이고 속도는 전부 같다. */
.viewport, .demo { --phase:0ms; }
.bar-row:nth-child(2n), .fact:nth-child(2n), tbody tr:nth-child(2n) { --phase:-163ms; }
.bar-row:nth-child(3n), .fact:nth-child(3n), tbody tr:nth-child(3n) { --phase:-379ms; }
.bar-row:nth-child(4n), .fact:nth-child(4n), tbody tr:nth-child(4n) { --phase:-902ms; }
.bar-row:nth-child(5n), .fact:nth-child(5n), tbody tr:nth-child(5n) { --phase:-617ms; }
.bar-row:nth-child(7n), .fact:nth-child(7n), tbody tr:nth-child(7n) { --phase:-1231ms; }

/* 수가 설 자리 — 릴이 숫자를 굴린다. */
.slot[data-slot="num"] i { width:.68em; }
.slot[data-slot="num"] i::before { content:"0\A 1\A 2\A 3\A 4\A 5\A 6\A 7\A 8\A 9\A 0"; white-space:pre; }
/* 시작점만 어긋난다. 음수라 첫 프레임부터 이미 갈려 있다 — 속도는 전부 같다. */
/* 위상 차이는 **한 칸(110ms)의 배수가 아니다.** 배수로 어긋내면 어느 순간에도 릴이
   1·2·3·4… 로 나란히 서서 수열처럼 읽힌다. 일부러 어긋난 값을 쓴다. */
.slot[data-slot="num"] i:nth-child(2)::before { animation-delay:calc(var(--phase) - 63ms); }
.slot[data-slot="num"] i:nth-child(3)::before { animation-delay:calc(var(--phase) - 291ms); }
.slot[data-slot="num"] i:nth-child(4)::before { animation-delay:calc(var(--phase) - 537ms); }
.slot[data-slot="num"] i:nth-child(5)::before { animation-delay:calc(var(--phase) - 812ms); }
.slot[data-slot="num"] i:nth-child(6)::before { animation-delay:calc(var(--phase) - 946ms); }
.slot-unit { font-weight:400; color:var(--mute); align-self:center; margin-left:2px; }

/* 글이 설 자리 — **한 글자씩 끊어서 찍는다.** 다 찍으면 멈추고, 멈춘 뒤 지우고, 다음 낱말을
   찍는다. 낱말 길이가 셋이라 어느 폭도 고정되지 않는다.

   **글자를 찍지 않는다.** 찍는 순간 그것이 가짜 값이다 — 자라는 것은 자리의 폭뿐이고
   읽을 것이 하나도 없다. 폭도 계속 달라지므로 폭이 무엇을 말하지도 못한다.

   **매끄럽게 자라면 타이핑이 아니라 로딩 막대로 읽힌다.** 한 칸(`--cell`)씩 `steps()` 로
   뛴다. 한 칸 찍는 데 100ms, 다 찍으면 1000ms 멈추고, 지울 때는 한 칸 50ms.

   그래서 **폭(`width`)을 직접 움직여도 된다.** 여기서 transform 을 고집하던 까닭은 매 프레임
   배치가 다시 잡히는 것이었는데, `steps()` 가 걸리면 한 주기에 스무 번 남짓만 바뀐다. 대신
   칸무늬가 안 늘어난다 — `scaleX` 로 줄이면 무늬까지 눌려 칸이 칸으로 안 읽힌다.

   커서는 자란 줄의 **오른쪽 테두리**다. 따로 따라다니게 하면 시간표가 둘이 되어 어긋난다. */
.slot[data-slot="text"] i { width:calc(var(--cell) * 11); position:relative; overflow:visible;
  -webkit-mask-image:none; mask-image:none; height:var(--reel); margin-block:0; }
.slot[data-slot="text"] i::before { content:""; position:absolute; box-sizing:content-box;
  left:0; top:calc(50% - .17em); width:0; height:.34em;
  border-right:1px solid var(--mute);
  background-image:linear-gradient(90deg, var(--line) 0 74%, transparent 74% 100%);
  background-size:var(--cell) 100%; background-repeat:repeat-x;
  animation:type var(--type) linear infinite calc(var(--phase) * 5),
            blink var(--type) steps(1, end) infinite calc(var(--phase) * 5); }
/* **한 칸씩 끊어 뛴다.** 구간마다 칸 수가 달라 `steps()` 를 구간에 적는다.
   6칸 → 11칸 → 8칸 을 돌고 한 바퀴가 6750ms 다 (100·n + 1000 + 50·n 셋의 합). */
@keyframes type {
  0% { width:0; animation-timing-function:steps(6, end); }
  8.889% { width:calc(var(--cell) * 6); animation-timing-function:steps(1, end); }
  23.704% { width:calc(var(--cell) * 6); animation-timing-function:steps(6, end); }
  28.148% { width:0; animation-timing-function:steps(11, end); }
  44.444% { width:calc(var(--cell) * 11); animation-timing-function:steps(1, end); }
  59.259% { width:calc(var(--cell) * 11); animation-timing-function:steps(11, end); }
  67.407% { width:0; animation-timing-function:steps(8, end); }
  79.259% { width:calc(var(--cell) * 8); animation-timing-function:steps(1, end); }
  94.074% { width:calc(var(--cell) * 8); animation-timing-function:steps(8, end); }
  100% { width:0; }
}
/* **커서는 찍는 동안 서 있고 멈춘 동안 깜빡인다.** 멈춘 1000ms 를 넷으로 나눠 두 번 꺼진다. */
@keyframes blink {
  0% { border-right-color:var(--mute); }
  8.889% { border-right-color:transparent; }
  12.593% { border-right-color:var(--mute); }
  16.296% { border-right-color:transparent; }
  20% { border-right-color:var(--mute); }
  44.444% { border-right-color:transparent; }
  48.148% { border-right-color:var(--mute); }
  51.852% { border-right-color:transparent; }
  55.556% { border-right-color:var(--mute); }
  79.259% { border-right-color:transparent; }
  82.963% { border-right-color:var(--mute); }
  86.667% { border-right-color:transparent; }
  90.37% { border-right-color:var(--mute); }
  100% { border-right-color:var(--mute); }
}

@keyframes reel { from { transform:translateY(0); } to { transform:translateY(calc(var(--reel) * -10)); } }
@keyframes reel-text { from { transform:translateY(0); } to { transform:translateY(calc(var(--reel) * -4)); } }

.big .slot { --reel:1.05em; }
/* 큰 자리의 **숫자 칸**만 좁힌다. 글 자리의 칸은 `--cell` 이 갖는다 — 여기서 같이 좁히면
   자란 줄이 칸 밖으로 넘쳐 옆 글자 위에 눕는다. */
.big .slot[data-slot="num"] i { width:.62em; }
td .slot, th .slot { max-width:100%; }

/* **모양이 계속 갈리는 표식.**

   여기가 「가짜 값을 그리지 마라」와 부딪히는 것처럼 보이는 자리다. 막아야 하는 것은
   **값으로 읽히는 것**이지 움직임 자체가 아니다. 값이 되는 길은 둘뿐이라 둘을 막는다.

   하나. **눈금도 수도 이름도 붙지 않는다.** 그것이 없으면 꺾은선 모양만으로는 어떤 값도
   읽을 수 없다. 잠깐 서 있어도 읽을 것이 없다.

   둘. **한 모양이 고정되지 않는다.** 고정되면 그것이 「이 subject 의 선」으로 읽힌다.
   정지 구간이 있어도 **다음 것이 오면** 된다 — 오히려 통째로 갈리는 편이 「이건 값이 아니다」를
   더 분명히 말한다.

   크기·순서도 말하지 않는다. 흔들리는 폭과 속도가 **모든 자리에서 같고** 시작점만 어긋난다.
   그래서 어느 막대가 긴지가 끊임없이 뒤집힌다 — 한 번도 고정되지 않는 순서는 순서가 아니다. */
.track, .band { position:relative; overflow:hidden; }
.wave { --pass:4000ms; }  /* 넷이 나눠 쓰므로 한 모양이 1초쯤 선다 */
.track .wave { position:absolute; left:0; top:0; bottom:0; width:100%;
  background:var(--line); transform-origin:left center;
  animation:stretch var(--pass) ease-in-out infinite var(--phase); }
@keyframes stretch {
  0% { transform:scaleX(.22); } 28% { transform:scaleX(.86); }
  55% { transform:scaleX(.38); } 78% { transform:scaleX(.67); } 100% { transform:scaleX(.22); }
}
/* 띠는 **어디서 나뉠지**를 말한다. 마디가 흐르면서 조각 폭이 함께 바뀐다. */
/* 띠도 **transform 만 움직인다.** background-position 을 움직이면 매 프레임 다시 칠해져
   막대·선과 달리 혼자 버벅인다. 마디는 미리 깔아 두고 그것을 밀고 늘인다. */
.band .wave { position:absolute; left:0; top:0; bottom:0; width:250%;
  background-repeat:repeat-x; background-size:14% 100%;
  background-image:linear-gradient(90deg, var(--line) 0 46%, transparent 46% 54%, var(--line) 54% 100%);
  transform-origin:left center; will-change:transform;
  animation:split var(--pass) ease-in-out infinite var(--phase); }
@keyframes split {
  0% { transform:translateX(0) scaleX(1); }
  50% { transform:translateX(-21%) scaleX(.62); }
  100% { transform:translateX(-42%) scaleX(1); }
}
/* 선은 **끊기지 않고 이어서 변형된다.** 한 선이 다음 모양으로 흘러간다 — 페이드 교대가 아니다.
   한 모양이 고정되면 그것이 「이 subject 의 선」으로 읽히지만, 끊임없이 변형되면 어느 것도
   그렇게 읽히지 않는다. 게다가 눈금도 수도 이름도 없어 모양만으로는 어떤 값도 읽을 수 없다.

   **`d` 를 보간한다.** 꼭짓점 수가 같은 꺾은선 사이라 좌표가 짝지어 움직인다. 이 환경의
   chromium 에서 실제로 보간되는 것을 재고 썼다 — 4000ms 선형 구간의 절반에서 y 가 100 에서
   50.42 로, 12.5% 지점에서 87.92 로 왔다(기대값 50 · 87.5, 차이는 프레임 경계).

   **좌표는 여기서 나온 수가 아니다.** `render.mjs` 의 `CHART` 와 `emptyAxes()` 의 SHAPES 가
   낸 꼭짓점을 그대로 옮겨 적은 것이고, 둘이 어긋나면 `viewer.test.mjs` 가 문다.

   못 받는 브라우저에서는 **꺾은선 넷의 교대가 그대로 남는다.** 어느 쪽을 세울지는 아래
   `@supports` 가 고르고, 한쪽은 반드시 선다 — 선이 아예 없는 자리는 만들지 않는다. */
/* 못 받는 자리의 넷. **바뀌는 것은 opacity 뿐**이라 갈아 끼울 때 걸리지 않는다.
   넷이 같은 시간표를 쓰고 **시작점만 넷으로 나뉜다.** */
svg.line .wave { fill:none; stroke:var(--line); stroke-width:1.5; opacity:0;
  will-change:opacity; animation:swap var(--pass) linear infinite var(--phase); }
svg.line .wave:nth-child(2) { animation-delay:calc(var(--pass) / -4); }
svg.line .wave:nth-child(3) { animation-delay:calc(var(--pass) / -2); }
svg.line .wave:nth-child(4) { animation-delay:calc(var(--pass) / -4 * 3); }
@keyframes swap {
  0%, 21% { opacity:1; } 25%, 96% { opacity:0; } 100% { opacity:1; }
}
/* **흐르는 선은 교대 규칙 뒤에 적는다.** 같은 표식(`.wave`)을 달고 있어 무게가 같고, 앞에
   적으면 교대 쪽 `opacity:0` 과 `animation:swap` 이 이겨 **흐르는 선이 안 보이고 안 흐른다.**
   실제로 그렇게 서 있었고 계산값을 물어 잡았다. */
svg.line .wave-morph { fill:none; stroke:var(--line); stroke-width:1.5; opacity:1;
  animation:morph var(--pass) linear infinite var(--phase); }
@keyframes morph {
  0%, 100% { d:path("M 78.0,92.3 L 170.0,148.1 L 262.0,72.6 L 354.0,126.8 L 446.0,164.5 L 538.0,103.8 L 630.0,139.9"); }
  25% { d:path("M 78.0,154.6 L 170.0,85.8 L 262.0,136.6 L 354.0,59.5 L 446.0,116.9 L 538.0,159.6 L 630.0,97.2"); }
  50% { d:path("M 78.0,61.2 L 170.0,121.8 L 262.0,162.8 L 354.0,90.7 L 446.0,75.9 L 538.0,135.0 L 630.0,49.7"); }
  75% { d:path("M 78.0,133.3 L 170.0,108.7 L 262.0,49.7 L 354.0,151.4 L 446.0,94.0 L 538.0,64.4 L 630.0,121.8"); }
}
/* **둘 중 하나만 선다.** 보간되면 흐르는 선 하나, 아니면 교대하는 넷. 둘 다 서면 겹쳐 보이고
   둘 다 안 서면 자리가 빈다. 뒤에 오는 조용한 자리가 이 둘을 다시 덮는다 — 같은 무게로 적어
   차례가 이기게 둔다. */
@supports (d:path("M 0 0")) {
  /* 꺾은선 넷은 **요소 이름으로** 감춘다. `.wave` 로 감추면 같은 표식을 단 흐르는 선까지
     같은 무게로 걸려 그쪽이 먼저 적힌 만큼 져 버린다 — 실제로 그렇게 사라졌다. */
  svg.line polyline { display:none; }
}
@supports not (d:path("M 0 0")) {
  svg.line .wave-morph { display:none; animation:none; }
}

/* **움직임을 끈 사람에게는 조용한 자리가 선다.** 굴리던 것이 멈추는 것이 아니라 사라진다 —
   멈춘 릴에 숫자가 남으면 그것이 읽을 수 있는 정지 숫자가 된다. 자리의 모양은 그대로 남는다. */
@media (prefers-reduced-motion: reduce) {
  /* **숫자를 내던 선택자를 그대로 다시 적는다.** 덜 구체적인 `.slot i::before` 로 덮으려 하면
     `.slot[data-slot="num"] i::before` 가 캐스케이드에서 이겨 멈춘 릴에 0 이 남는다.
     실제로 한 번 그렇게 서 있었고 눈으로 잡았다. */
  .slot i::before,
  .slot[data-slot="num"] i::before,
  .slot[data-slot="text"] i::before { animation:none; content:""; background-image:none;
    height:auto; padding-top:0; }
  /* 넘치게 두던 칸을 제자리로 돌리고 마스크를 걷는다 — 조용한 자리는 흐려질 것이 없다. */
  .slot i { height:var(--reel); margin-block:0; background:var(--surface);
    -webkit-mask-image:none; mask-image:none; }
  /* **멈추는 것이 아니라 사라진다.** 멈춘 그림은 값처럼 읽힌다. 자·축·띠의 모양은 남는다. */
  .wave { display:none; }
  /* 써 넣던 줄도 사라진다 — 멈춘 자리에서 **길이가 그대로 남으면 그 길이가 값이 된다.**
     칸의 뿌연 바탕만 남아 「여기에 글이 온다」를 말한다. */
  .slot[data-slot="text"] i::before { display:none; }
  /* 흐르던 선도 사라진다 — `.wave` 하나로도 덮이지만 `@supports` 가 같은 무게로 다시 세우는
     자리라 **같은 선택자로 또 적어** 차례로 이긴다. */
  svg.line .wave-morph { display:none; animation:none; }
}

/* 틀이 아니라 자리다 */
.blank { padding:4px 0 8px; }
/* 그리지 못한 자리. 테두리 친 알약이 아니라 굵은 monospace 다. */
.broken, .undrawable { font:12px ui-monospace,SFMono-Regular,Menlo,monospace;
  font-weight:700; color:var(--ink); }

/* 겹치는 쪽 (line · list) — 값을 못 얹은 subject 는 축 아래에 선다 */
.offs { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 14px; margin-top:var(--row); }
/* **무슨 줄인지 줄 머리가 한 번 말한다.** 이름만 늘어놓으면 범례로 읽히고,
   subject 마다 붙이면 같은 문장이 되풀이된다. */
.off-said { font-size:12.5px; color:var(--mute); margin-right:2px; }
.off { font-size:12.5px; color:var(--mute); }
.off.is-focus { color:var(--ink); }
.off.is-focus .who { font-weight:700; }

/* focus 를 따라 바뀌는 쪽 (stat · facts · bars) — 무엇을 보고 있는지 늘 이름으로 말한다 */
/* 무엇을 보고 있는지는 **화면에 한 번** — 오른쪽 띠가 말한다. facet 마다 되풀이하지 않는다. */
.watching { font-size:12px; color:var(--mute); white-space:nowrap; }
.watching b { color:var(--ink); }
.facts { display:grid; grid-template-columns:max-content 1fr; gap:6px 18px; margin:0; font-size:14px; }
.fact { display:contents; }
.facts dt { color:var(--mute); font-size:13px; padding-top:1px; }
.facts dd { margin:0; }
.big { font-size:27px; letter-spacing:-.01em; display:flex; align-items:center; gap:2px; }
.big .note-mark { vertical-align:baseline; }
/* 큰 값의 자리에서는 표기도 그 자리만큼 선다 — 값이 있던 자리가 비어 보이면 안 된다. */
.big .miss { font-size:22px; }
.big .undrawable { font-size:15px; }

/* 막대. 자는 subject 전체의 최대값으로 고정돼 focus 를 옮겨도 길이를 견줄 수 있다. */
.bar-row { display:grid; grid-template-columns:130px 1fr 150px; gap:12px; align-items:center; padding:4px 2px; }
.bar-row .who { font-size:13px; color:var(--mute); }
.track { display:block; height:10px; background:var(--surface); }
.fill { display:block; height:100%; background:var(--ink); }
.val { font-size:13px; text-align:right; }

/* **표만 옆으로 굴린다.** subject 가 늘수록 넓어지는 유일한 자리다 — 페이지 전체가 옆으로
   밀리면 왼쪽 목차도 위쪽 띠도 함께 사라진다. 그래서 스크롤은 이 상자의 것이다. */
/* 안쪽 여백은 고른 열의 테두리가 상자 모서리에 닿아 잘리지 않게 두는 자리다 —
   스크롤 상자는 한 축만 굴릴 수 없어 위아래도 함께 자른다. */
.table-scroll { overflow-x:auto; margin-top:var(--step); padding:3px; }
/* 열 너비가 균일하다. 자리마다 너비가 다르면 넓은 칸이 중요해 보인다 —
   `fixed` 가 남은 폭을 고르게 나누고, 다 못 담으면 표가 상자 밖으로 넘쳐 굴러간다. */
/* **하나를 쪼갠 띠.** 조각이 합쳐 한 덩어리가 된다 — 파이가 아니라 띠인 까닭은
   색으로 가르지 않기 때문이다. 조각은 **자리 차례로** 두 무채색을 번갈아 쓴다:
   크기와 무관하고 앞이 뒤보다 무겁다는 뜻이 없다. 사이의 흰 틈이 경계를 세운다. */
/* 조각 사이는 **틈**이 가른다 — 띠를 덧대지 않는다. 흰 바탕이 그대로 경계가 된다. */
.band { display:flex; gap:2px; height:14px; margin-top:var(--step); background:var(--surface); }
.slice { display:block; height:100%; background:var(--ink); }
.slice:nth-child(even) { background:var(--mute); }
.slices { margin-top:var(--step); }
.slice-row { display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:2px 0; }
.slice-row .who { color:var(--mute); }

table { border-collapse:collapse; table-layout:fixed; width:max-content; min-width:100%;
  font-size:14px; }
th, td { border:1px solid var(--line); padding:8px 11px; text-align:left; vertical-align:top; }
thead th { font-weight:600; font-size:13px; width:180px; }
th.corner, th.row-label { font-weight:600; width:140px; color:var(--mute); }

/* 축이 이미 틀이다. 테두리를 두르지 않는다.
   **좁아지면 상자가 굴러간다** — 그림을 통째로 줄이면 축 라벨과 선 끝 이름이 읽을 수
   없게 작아진다. `list` 표와 같은 규칙이다: 페이지가 아니라 그 상자가 굴러간다. */
.chart-scroll { overflow-x:auto; }
svg.line { display:block; width:100%; min-width:560px; height:auto; background:#ffffff; }
svg .axis { stroke:var(--line); stroke-width:1; }
svg .tick { font-size:11px; fill:var(--mute); }
svg .ty { text-anchor:end; }
svg .tx { text-anchor:start; }
svg .tx.end { text-anchor:end; }
/* **선은 세 갈래로 갈린다 — 지금 보는 것 · 직전에 보던 것 · 나머지.**
   이 색은 **subject 의 것이 아니라 상태의 것이다.** 같은 subject 라도 focus 가 옮겨 가면
   색이 바뀐다 — 걷어낸 subject 팔레트를 되살리는 것이 아니다.
   **색에만 기대지 않는다**: 굵기와 진하기가 같은 순서를 함께 말해 색 없이도 갈린다.
   평가가 아니다 — 뚜렷한 것이 「더 좋은 것」이 아니라 **보고 있는 것**이라, 경고색·성공색을 피한다. */
.trace-now { --trace:#1a1a1a; }    /* 무채색. 지금 보는 것이 가장 뚜렷하다 */
.trace-prior { --trace:#3f6fb5; }  /* 좋고 나쁨을 뜻하지 않는 파랑 */
.trace-rest { --trace:#9a9a9a; }   /* 무채색. 가장 옅다 */
svg .series { fill:none; stroke:var(--trace, var(--ink)); }
svg .series.trace-now { stroke-width:2.6; opacity:1; }
svg .series.trace-prior { stroke-width:1.8; opacity:.8; }
svg .series.trace-rest { stroke-width:1.1; opacity:.45; }
svg circle.series, svg circle.dot { fill:var(--trace, var(--ink)); stroke:none; }
svg .series-label { font-size:11px; fill:var(--trace, var(--mute)); font-weight:600;
  paint-order:stroke; stroke:#ffffff; stroke-width:3px; stroke-linejoin:round; }
svg .series-label.is-focus { font-weight:700; }

/* 주석은 띠가 아니라 **글**로 읽힌다.
   **줄 사이가 전부 같다** — 한 묶음 안이든 묶음과 묶음 사이든 `--row` 하나다.
   간격으로 무엇을 가르지 않는다. 가르는 일은 글(이름)이 한다. */
.notes { list-style:none; margin:0; padding:0;
  display:flex; flex-direction:column; gap:var(--row); }
.body .notes { margin-top:var(--step); }
.note { display:grid; grid-template-columns:2.8em 1fr; gap:0 10px; font-size:12.5px; }
.note .kind { color:var(--kind, var(--mute)); font-size:11px; line-height:1.85; white-space:nowrap; }

/* **필드에 붙는 말.** 표시는 값 옆에 늘 서 있고 내용은 가리키거나 초점을 받으면 열린다.
   **표시는 하나이고 중립이다** — 「여기 붙은 말이 있다」만 말한다. 갈래에 따라 달라지면
   값이 갈래로 물든다. 갈래는 열었을 때 줄마다 선다. */
.note-mark { position:relative; display:inline-flex; align-items:center; gap:2px;
  margin-left:6px; vertical-align:-2px; cursor:help; color:var(--mute); }
.note-mark:hover, .note-mark:focus { color:var(--ink); outline:none; }
.note-mark:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
/* 표시 자체는 갈래를 모른다 — 글자색을 따라가고 갈래색을 받지 않는다. */
.note-mark > .mark-icon { stroke:currentColor; }
/* 수를 적지 않는다 — 값 옆에 서는 것은 표시 하나뿐이고, 몇 개인지는 열면 보인다. */
.note-pop { position:absolute; left:0; top:calc(100% + 6px); z-index:5; display:none;
  min-width:260px; max-width:min(380px, 60vw); padding:10px 12px;
  background:#ffffff; border:1px solid var(--line); border-radius:var(--r); text-align:left; }
/* 여는 길 셋 — 가리키기 · 초점 · **누르기.** 누르기는 앱이 표시를 켜서 연다:
   손가락에는 가리키기가 없고 글자 위의 초점은 기기마다 달리 돈다. */
.note-mark:hover .note-pop, .note-mark:focus-within .note-pop, .note-mark:focus .note-pop,
.note-mark.is-open .note-pop { display:block; }
.note-pop .notes { margin-top:0; }
.note-pop .note { cursor:auto; }
.pop-close { display:none; }

/* 주석 갈래의 색. **통용되는 UI 시맨틱을 따른다** — 주의는 warning, 보충은 info.
   이 자리를 어떻게 읽으라는 말이지 **그 제안서가 좋고 나쁘다는 말이 아니다.**
   그래서 색은 갈래 표시와 갈래 이름에만 얹고 값이나 글에는 얹지 않는다.
   **색이 나오는 곳은 여기뿐이다** — 값·subject·facet 에서는 색이 나오지 않는다. */
.note-quote { --kind:var(--mute); }   /* 근거·출처. 상태가 아니다 */
.note-tip { --kind:#175cd3; }         /* 도움말의 통용색 */
.note-note { --kind:var(--mute); }    /* info — 사람이 준 예대로 중립 회색 */
.note-caution { --kind:#b42318; }     /* warning 의 통용색 */

.kind-icon, .mark-icon { width:12px; height:12px; margin-right:4px; vertical-align:-2px;
  fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.kind-icon { stroke:var(--kind, var(--mute)); }
.mark-icon { stroke:var(--mute); }
.note .kind { color:var(--kind, var(--mute)); }
.note .text { color:var(--ink); }
/* 좁은 자리에서는 매달린 라벨이 폭을 먹는다. 같은 줄에 흘려 보낸다. */
td .note { display:block; }
td .note .kind { display:inline; margin-right:5px; line-height:inherit; }
/* 말은 데이터 뒤에 한자리에 모인다. 묶음 사이도 줄 사이와 같은 자다. */
.said { margin-top:var(--step); display:flex; flex-direction:column; gap:var(--row); }
/* facet 것과 subject 것 사이의 **짧은 구조선.** 판을 가로지르지 않고 글머리 쪽에만 놓인다 —
   갈래 이름이 서는 폭만큼이다. 이름이 가르는 것을 거들 뿐이라 무채색이고 위계를 말하지 않는다.
   줄 사이가 `--row` 로 균일한 흐름을 깨지 않는다: 자기 자리를 갖되 앞뒤 간격은 같은 자다. */
.said-cut { width:2.8em; height:0; margin:0; border:none; border-top:1px solid var(--line); }

/* 판을 고르는 줄. 넓은 화면에는 없다 — 둘이 나란히 서므로 고를 것이 없다. */
.pane-pick { display:none; }

/* ---------------------------------------------------------------- 손에 잡히는 화면 */

/* **누를 것은 손가락만 해야 한다.** 통용되는 자가 44px 이고, 서로 붙어 있지 않아야
   옆것을 누르지 않는다. 좁은 화면이라고 다른 규칙으로 갈아타지 않는다 —
   자리가 없으면 접거나 미룰 뿐이고, 굵기·여백으로 말하는 방식은 그대로다. */
@media (max-width: 900px), (pointer: coarse) {
  button, select, .toc-link { min-height:44px; }
  /* 기본 네모는 13px 이라 손가락이 못 맞춘다. 상자를 키우고 줄도 손가락만 하게 한다. */
  label:has(input) { min-height:44px; }
  input[type="checkbox"] { width:20px; height:20px; }
  button.pick { padding:0 14px; font-size:13.5px; }
  #focus-buttons { gap:8px; }
  .choice { gap:8px; }
  .choice button { padding:0 14px; }
  .tabs { gap:6px; }
  .tab { min-height:44px; padding:0 12px; }
  .toc-link { display:flex; align-items:center; padding:0 18px; }
  .toc-link.has-icon { padding:0 18px; }
  .bar { gap:10px; padding:8px 14px; }
  /* 닫는 길도 손가락으로 되어야 한다. */
  .pop-close { min-height:44px; padding:0 16px; }
  /* **글 사이에 선 표시도 손가락이 맞춰야 한다.** 누르는 자리를 넓히되 음수 여백으로
     흐름은 그대로 둔다 — 줄 간격이 좁아 44px 을 채우면 위아래 줄의 자리와 겹친다.
     겹치면 옆것이 눌리므로 줄 사이에 맞는 만큼만 넓힌다. */
  .note-mark { padding:8px 6px; margin:-8px 0 -8px 0; }
  .big .note-mark, .val .note-mark { padding:10px 8px; margin:-10px 0; }
}

@media (max-width: 420px) {
  /* 전화기에서 편집기가 서면 글을 넣을 만큼은 되어야 한다 — 밖에서 덧대던 줄을 들였다. */
  textarea { min-height:44vh; }
}

@media (max-width: 900px) {
  /* 좁은 화면엔 가리키기가 없다. 아래에서 올라오는 판으로 연다. */
  .note-pop { position:fixed; inset:auto 0 0 0; max-width:none; min-width:0;
    border:none; border-top:1px solid var(--line); padding:18px 18px 22px; }
  .pop-close { display:block; margin-top:14px; margin-left:auto; }

  /* 좁아도 판이 스스로 스크롤한다 — 문서 전체가 밀리면 띠가 또 사라진다. */
  .site { grid-template-columns:1fr; grid-template-rows:auto 1fr; }
  /* 목차가 판을 스스로 스크롤하게 됐으므로 위쪽을 다 먹지 않게 묶는다. */
  /* 목차가 위쪽을 다 먹지 않게 묶는다 — 붙박이라 먹은 만큼 본문이 줄어든다.
     좁을수록 촘촘히 눕히고, 그래도 넘치면 목차가 스스로 굴러간다. */
  .nav { border-right:none; border-bottom:1px solid var(--line); max-height:26vh; }
  .nav nav { display:flex; flex-wrap:wrap; gap:2px 4px; padding:0 10px 10px; }
  .brand { padding:10px 12px 6px; }
  .nav .group { width:100%; padding:6px 6px 0; }
  .toc-link { width:auto; padding:0 10px; }
  .page { padding:20px 16px 56px; }
  /* **분석뷰가 주인공이다.** 손가락으로 JSON 을 고치는 사람은 없다 — 판 하나만 세우고
     편집기는 고를 때만 나온다. 위아래로 쌓으면 분석뷰를 보려고 JSON 을 지나가야 한다. */
  .pane-pick { display:flex; gap:6px; padding:0 10px; border-bottom:1px solid var(--line); }
  .panes { grid-template-columns:1fr; grid-template-rows:1fr; border-top:none; }
  .pane.edit { display:none; border-right:none; }
  .playground.editing .pane.edit { display:flex; }
  .playground.editing .pane.view { display:none; }
  .playground .page-head { padding:16px 16px 10px; }
  /* 좁아도 표와 그림은 자기 상자에서 굴러간다 — 페이지는 밀리지 않는다. */
  .viewport { padding:20px 16px 56px; }
  /* 좁아도 표는 자기 상자에서 굴러간다 — 열은 그대로 균일하다. */
  /* **막대는 좁아도 눕는다.** 라벨을 줄이고 값을 제 폭만 쓰게 해서 한 줄을 지킨다 —
     접어 올리면 막대가 라벨 아래로 내려가 가로 막대로 읽히지 않는다. */
  .bar-row { grid-template-columns:minmax(72px, 25%) 1fr max-content; gap:8px; }
}
</style>
</head>
<body>
<div class="site">
  <!-- 목차. 정본은 카탈로그다 — primitive element 가 늘거나 줄면 여기가 따라 바뀐다. -->
  <aside class="nav">
    <div class="brand">weave</div>
    <nav id="toc"></nav>
  </aside>

  <main class="content">
    <!-- 설명서 쪽. 고른 항목 하나를 그린다. -->
    <article class="page" id="page"></article>

    <!-- 플레이그라운드. DOM 을 살려 둬야 편집 중인 글이 안 날아간다. -->
    <section class="playground" id="playground" hidden>
      <header class="page-head">
        <h1 id="pg-title"></h1>
        <p class="lead" id="pg-lead"></p>
      </header>
      <!-- 전화기에서는 판 하나만 선다. **분석뷰가 먼저다** — 손가락으로 JSON 을 고치는
           사람은 없다. 넓은 화면에서는 이 줄이 서지 않고 둘이 나란히 선다. -->
      <div class="pane-pick" id="pane-pick">
        <button type="button" class="tab" data-pane="view" aria-pressed="true">분석뷰</button>
        <button type="button" class="tab" data-pane="edit" aria-pressed="false">템플릿·값</button>
      </div>
      <div class="panes">
        <div class="pane edit">
          <div class="bar">
            <label for="sample">샘플</label>
            <select id="sample"></select>
          </div>
          <div class="tabs" id="tabs"></div>
          <textarea id="editor" spellcheck="false" autocomplete="off"></textarea>
          <div class="strip" id="strip"></div>
        </div>
        <div class="pane view">
          <div class="bar">
            <span id="focus-buttons"></span>
            <span class="watching" id="watching"></span>
          </div>
          <!-- 스크롤하는 것은 본문뿐이다. 띠는 바깥에 있어 늘 제자리를 지킨다. -->
          <div class="scroll">
            <div class="viewport" id="view"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

// 순수 함수다 — 문서를 받아 HTML 문자열을 낸다. DOM 을 모른다. 그래서 브라우저 없이도
// 고정 케이스를 걸 수 있다 (`tests/viewer.test.mjs`).
//
// **facet 종류를 아는 분기가 없다.** element 로만 고른다 (ELEMENTS 표).
// **subject 마다 값 한 벌이 정확히 하나 있다.** 비어 있을 수 있고, 누가 자리에 서는지는 그 값 한 벌들이
// 말한다 — 명단을 따로 받지 않는다. 아직 분석되지 않았다는 것도 특별한 상태가 아니라
// **전부 비어 있는 값 한 벌과 주석**이 말한다.
// **판정하지 않는다.** 스키마 판정의 정본은 Python 검사기 하나다. 여기서는 그리지 못하는
// 자리를 표시하고 무엇이 이상한지 적기만 한다.


// 주석 갈래의 **정본 이름**이다(glossary §2.4). 참조 뷰어는 언어를 배우는 자리라
// 읽기 좋은 딴 이름을 쓰지 않는다 — 제품 화면의 라벨은 앱이 따로 정한다.
const KIND_LABEL = { quote: "인용", tip: "팁", note: "보충", caution: "주의" };

// **없다는 말 넷.** 뜻이 다르면 표기도 달라야 한다 — 뭉개면 「모른다」와 「없다」가 같아진다.
const NO_VALUE = "값 없음"; // 그 필드에 값이 없다
const NO_ITEM = "없음"; // 목록은 읽었는데 그 항목이 여기 없다
const NO_ITEMS = "항목 없음"; // 목록 자체가 비었다 — 아무 subject 도 항목이 없다
const UNDRAWABLE = "그리지 못한다"; // 값의 문제가 아니라 템플릿과 값이 어긋났다

/**
 * **표기는 「모른다」를 가리킨다. 아는 사실은 글로 말한다.**
 *
 * 「값 없음」이라는 글은 값보다 길어 자리를 먹고 여러 개가 모이면 화면을 덮는다. 그래서
 * 표기로 줄였다. 하지만 줄일 수 있는 것은 **값이 없다는 것 하나뿐**이다 — 나머지는 전부
 * 우리가 **아는 사실**이라 글이 제값을 한다.
 *
 * - 「없음」 — 목록을 읽었고 그 항목이 없다는 것을 **안다**
 * - 「항목 없음」 — 목록이 비었다는 것을 **안다**
 * - 「있음」 — 있다는 것을 **안다**
 * - 「그리지 못한다: …」 — 무엇이 어긋났는지 **안다**
 *
 * 표기 둘을 눈으로 가르려다 쓰다 만 글자처럼 보이느니, 아는 것은 말하게 두는 편이 낫다.
 * **빈 칸으로 두지 않는다** — 아무것도 없으면 렌더가 깨진 것과 구별되지 않는다.
 * **읽어 주는 기계에는 말이 남는다** — 표기는 이름표로 제 뜻을 말한다.
 */
const NO_VALUE_MARK = "—"; // 표에서 빈 자리를 가리키는 통용 표기

/**
 * **선이 갈리는 세 갈래.** subject 가 아니라 **상태**다 — 같은 subject 라도 focus 가
 * 옮겨 가면 갈래가 바뀐다. 걷어낸 subject 팔레트를 되살리는 것이 아니다.
 *
 * 색으로 가르되 **색에만 기대지 않는다** — 굵기와 진하기가 같은 순서를 함께 말한다.
 * 색을 못 보는 사람에게도 지금 무엇을 보고 있는지가 갈려야 한다.
 * 누가 누구인지는 여전히 **선 끝의 이름**이 말한다.
 *
 * 평가가 아니다. 뚜렷한 것이 「더 좋은 것」이 아니라 **보고 있는 것**이다 —
 * 그래서 경고색·성공색 계열을 쓰지 않는다.
 */
const TRACE = ["now", "prior", "rest"];

/** 선 하나가 어느 갈래인지. **오직 화면 상태에서만 나온다** — id 도 차례도 보지 않는다. */
function traceOf(id, focus, prior) {
  if (focus !== null && id === focus) return "now";
  // 직전이 현재와 같을 수는 없다. 같은 id 가 들어오면 직전이 없는 것으로 본다.
  if (prior !== null && prior !== focus && id === prior) return "prior";
  return "rest";
}

function esc(text) {
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#x27;");
}

// ---------------------------------------------------------------- 값 읽기

/**
 * 값 한 자리를 읽는다.
 *
 * **고르는 자리를 타는 필드면 고른 것의 값을 읽는다.** 고른 것이 바뀌어도 읽는 자리는
 * 그대로이고 값만 달라진다 — 이 한 줄이 「고르는 자리는 facet 구성을 바꾸지 않는다」를
 * 구조로 지킨다. 어느 자리를 타는지는 **템플릿의 필드 선언**이 말한다.
 */
function cell(valueset, facetId, decl, chosen) {
  const key = typeof decl === "string" ? decl : decl?.key;
  if (!valueset) return { state: "empty", entry: null };
  const facet = valueset.facets?.[facetId];
  if (!facet) return { state: "empty", entry: null };
  const slot = facet.fields?.[key];
  const rides = typeof decl === "string" ? null : decl?.choice;
  const entry = slot?.byOption ? (rides ? slot.byOption[chosen?.[rides]] : null) : slot;
  if (!entry || entry.state !== "filled") return { state: "empty", entry: entry ?? null };
  return { state: "filled", entry };
}

function facetNotes(valueset, facetId) {
  return valueset?.facets?.[facetId]?.notes ?? [];
}

// ---------------------------------------------------------------- 값 쓰기

function grouped(value) {
  if (typeof value !== "number" || !Number.isFinite(value)) return String(value);
  return value.toLocaleString("en-US", { maximumFractionDigits: 10 });
}

function formatScalar(type, value) {
  if (type === "boolean") return value ? "예" : "아니오";
  if (type === "text" || type === "date") return String(value);
  if (typeof value !== "number" || !Number.isFinite(value)) return String(value);
  if (type === "money") return `${grouped(value)}원`;
  if (type === "ratio") return `${grouped(Math.round(value * 1e10) / 1e8)}%`;
  // 배수는 비율이 아니다 — 0.049 가 4.9% 이고 4.9 가 4.9 배다. 단위를 글로 열지 않고 타입을 하나 둔다.
  if (type === "multiple") return `${grouped(value)}배`;
  if (type === "duration") return `${grouped(value)}개월`;
  if (type === "age") return `${grouped(value)}세`;
  return grouped(value);
}

function formatValue(decl, value) {
  if (decl.shape === "single") return formatScalar(decl.type, value);
  if (decl.shape === "range") {
    if (value === null || typeof value !== "object" || Array.isArray(value)) return null;
    const low = "min" in value ? formatScalar(decl.type, value.min) : null;
    const high = "max" in value ? formatScalar(decl.type, value.max) : null;
    if (low !== null && high !== null) return `${low} ~ ${high}`;
    if (low !== null) return `${low} 이상`;
    if (high !== null) return `${high} 이하`;
    return null;
  }
  return null;
}

function axisNumber(axis, raw) {
  if (axis === "date") {
    const ms = Date.parse(`${raw}T00:00:00Z`);
    return Number.isNaN(ms) ? null : ms / 86400000;
  }
  return typeof raw === "number" && Number.isFinite(raw) ? raw : null;
}

// ---------------------------------------------------------------- HTML 조각

/** 갈래 표시. **통용되는 UI 시맨틱을 따른다** — 주의는 warning, 보충은 info.
 *  색은 갈래(`note-<kind>`)에서만 나온다. 값이나 subject 에서는 나오지 않는다. */
function kindIcon(kind) {
  const body = ICON[kind];
  if (!body) return "";
  return (
    `<svg class="kind-icon note-${esc(kind)}" viewBox="0 0 24 24" width="14" height="14" ` +
    `aria-hidden="true">${body}</svg>`
  );
}

/**
 * **필드에 붙는 주석.** 본문에 펼치지 않고 표시를 세워 그 자리에서 연다.
 *
 * **표시는 하나이고 중립이다.** 갈래를 값 옆에 늘어놓지 않는다 — 표시가 갈래를 따라
 * 달라지면 값이 갈래로 물들고, 그것은 「평가를 색으로 말하지 않는다」에서 걷어낸 자리다.
 * 값 옆의 표시가 하는 말은 **「여기 붙은 말이 있다」** 하나뿐이다.
 * **갈래는 툴팁 안에서 산다** — 열면 줄마다 자기 갈래 표시와 색을 갖는다.
 *
 * 여는 길 셋 — 가리키기(hover) · 초점(키보드) · 좁은 화면에서는 아래에서 올라오는 판.
 */
function markPop(inside, aria, kind = "") {
  return (
    `<span class="note-mark${kind ? ` ${kind}` : ""}" tabindex="0" role="button" ` +
    `aria-label="${esc(aria)}">` +
    `<svg class="mark-icon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">${ICON.note}</svg>` +
    `<span class="note-pop" role="tooltip">${inside}` +
    `<button type="button" class="pop-close">닫기</button></span></span>`
  );
}

function notePop(notes) {
  if (!Array.isArray(notes) || notes.length === 0) return "";
  // **수를 적지 않는다.** 값 옆에 서는 것은 표시 하나뿐이다 — 몇 개인지는 열면 보인다.
  // 세는 것은 읽는 사람의 일이 아니고, 수가 붙으면 값 옆이 다시 붐빈다.
  // (기계가 읽는 이름표에는 남는다. 눈에 보이는 글이 아니다.)
  return markPop(notesHtml(notes), `붙은 말 ${notes.length}`);
}

/**
 * 주석 묶음 하나.
 *
 * `where` 는 **지금 아무도 주지 않는다** — 주석이 늘 고른 subject 것만 나오므로 이름이
 * 그 사실을 두 번 말하고, 두 묶음을 가르는 일은 짧은 선이 맡는다. 자리를 남겨 둔 것은
 * **되돌리기 쉽게** 하려는 것이다: subject 것을 내는 호출에 이름을 둘째 인자로 주면 된다.
 */
/**
 * **이 필드가 무엇인지.** 필드 **이름 옆**의 표시를 열면 나온다.
 *
 * **자리가 뜻을 가른다** — 이름 옆은 템플릿의 것(모든 subject 에 같다), 값 옆은 그 subject 의
 * 값에 대한 말이다. 양끝으로 갈리니 섞이지 않는다.
 *
 * 여는·닫는 길은 값 주석이 쓰는 것과 **같은 것**이다 — 길 두 벌을 만들지 않는다.
 */
function hintMark(decl) {
  return decl?.hint ? markPop(`<p class="hint">${esc(decl.hint)}</p>`, "이 필드가 무엇인지", "hint-mark") : "";
}

function notesHtml(notes, where = "") {
  if (!Array.isArray(notes) || notes.length === 0) return "";
  const rows = notes.map((note) => {
    const kind = note?.kind ?? "note";
    const label = KIND_LABEL[kind] ?? kind;
    const prefix = where ? `<b class="who">${esc(where)}</b> ` : "";
    return (
      `<li class="note note-${esc(kind)}"><span class="kind">${kindIcon(kind)}${esc(label)}</span>` +
      `<span class="text">${prefix}${esc(note?.text ?? "")}</span></li>`
    );
  });
  return `<ul class="notes">${rows.join("")}</ul>`;
}

/**
 * **아직 아무도 오지 않은 자리.**
 *
 * subject 가 하나도 없을 때 값이 설 곳에 선다. 표기(`—`)를 쓰지 않는다 — 그것은
 * **어떤 subject 의 값을 모른다**는 말인데, 여기엔 모를 subject 자체가 없다.
 *
 * **가짜 값을 그리지 않는다.** 예시 숫자나 흐린 더미 값은 진짜 값으로 읽히는 순간
 * 우리가 지켜온 것이 무너진다. 그려도 되는 것은 **자리**뿐이라 빈 칸에 줄만 긋는다.
 * 깜빡이거나 움직이지 않는다 — 「기다리는 중」은 앱이 얹을 말이고 언어의 것이 아니다.
 */
/** 수로 서는 타입. 자리의 생김새를 값의 생김새에 맞추는 유일한 기준이다. */
const NUMERIC = new Set(["number", "money", "ratio", "multiple", "duration", "age"]);

/**
 * 자리 하나의 릴 수와 뒤에 붙는 단위. **타입마다 고정**이다 — 값에서 끌어오면
 * 자릿수 자체가 크기를 말해 버린다. 금액 자리는 늘 여섯 칸이고, 87,400 이든 8,740,000 이든 같다.
 */
const SLOT_SHAPE = {
  number: [6, ""], money: [6, "원"], ratio: [3, "%"], multiple: [3, "배"],
  duration: [3, "개월"], age: [3, "세"], boolean: [1, ""], text: [1, ""], date: [1, ""],
};

function slot(said = "값이 올 자리", type = "text", big = false) {
  const kind = NUMERIC.has(type) ? "num" : "text";
  const [count, unit] = SLOT_SHAPE[type] ?? SLOT_SHAPE.text;
  // **산출물은 자리만 낸다.** 표식(`.slot` · 릴 `<i>`)이 서고 **뷰어 스타일시트가 그것을 굴린다** —
  // 여기에 시간도 프레임도 애니메이션 지시도 한 글자 없다. 앱은 이 표식 위에 제 방식을 얹는다.
  //
  // 단위는 **값이 아니라 생김새**다. 「여기에 금액이 온다」를 수 없이 말할 수 있는 유일한 글자라
  // 정지해 있어도 값으로 오독되지 않는다 — 읽을 수 있는 정지 **숫자**만 두지 않으면 된다.
  const reels = "<i></i>".repeat(count);
  const tail = unit ? `<b class="slot-unit">${esc(unit)}</b>` : "";
  return `<span class="slot${big ? " slot-big" : ""}" data-slot="${kind}" ` +
    `role="img" aria-label="${esc(said)}">${reels}${tail}</span>`;
}

/**
 * **모양이 계속 바뀌는 표식.** 자와 띠가 어디까지 뻗는지만 말하고 크기는 말하지 않는다.
 * 무엇으로 바뀌는지는 뷰어가 정한다 — 여기엔 시간도 프레임도 없다.
 */
function wave() {
  return `<span class="wave" aria-hidden="true"></span>`;
}

/** 모른다는 **표기**. 왜 없는지는 주석이 글로 말한다. */
function missMark() {
  return (
    `<span class="miss value" role="img" aria-label="${esc(NO_VALUE)}" title="${esc(NO_VALUE)}">` +
    `${NO_VALUE_MARK}</span>`
  );
}

// 그리지 못한 자리. 렌더는 멈추지 않고 자리를 표시하고 까닭을 적는다.
function undrawable(report, where, why, shown) {
  report.push(`${where}: ${why}`);
  // **조용해지지 않는다.** 값이 없는 것이 아니라 템플릿과 값이 어긋난 것이라 표기로 줄이지
  // 않는다 — 글이 서고 무엇이 어긋났는지 적는다. 가름표는 표기(—)와 섞이지 않게 쌍점이다.
  return `<span class="undrawable" title="${esc(why)}">${UNDRAWABLE}: ${esc(shown ?? why)}</span>`;
}

function drawCell(report, where, decl, value) {
  const shown = formatValue(decl, value);
  if (shown === null) {
    return undrawable(report, where, `선언한 모양(${decl.shape ?? "없음"})과 값의 생김새가 다르다`, JSON.stringify(value));
  }
  return esc(shown);
}

// ---------------------------------------------------------------- primitive element

// ---------------------------------------------------------------- 비교하는 법 둘
//
// 순위 문법을 스키마에서 뺀 대신 **비교를 시각이 맡는다**(glossary §3.14 원칙 7).
// 다만 방법이 하나가 아니다 — **primitive element 마다 다르게 비교한다.**
//
// - **겹친다** (`line` · `list`) — 축이나 항목이라는 공유하는 자리가 있어 겹칠수록 읽을 것이 많아진다.
// - **focus 를 따라 바뀐다** (`stat` · `facts` · `bars`) — 겹칠 자리가 없어 억지로 늘어놓는 대신
//   **무엇을 그릴지 focus 가 고른다.** focus 가 강조 장치에서 고르는 자리로 커진다.
//
// **focus 가 없으면 첫 subject 를 그린다.** 늘어놓기로 돌아가지 않고, 빈 화면을 내지 않고,
// 무엇을 보고 있는지 이름으로 늘 말한다. 차례는 값 한 벌이 넘어온 차례이고 배치일 뿐 우열이 아니다.
const COMPARE = {
  stat: "focus", facts: "focus", bars: "focus", rows: "focus", parts: "focus",
  line: "overlay", list: "overlay",
};

/**
 * 겹치는 쪽에서 **고른 subject** 가 자리에 못 섰다는 말.
 *
 * **범례가 아니다.** 못 선 subject 를 줄줄이 적으면 그것이 범례다 — 안 보고 있는 것까지
 * 이름을 늘어놓게 된다. 지금 보고 있는 것에 값이 없으면 그건 알아야 하므로 **그때만**
 * 선다. 「말은 언제나 고른 subject 것」과 같은 줄이고, 이름을 적지 않는 까닭도 같다 —
 * 고른 것 하나뿐이라 이름이 그 사실을 두 번 말한다.
 */
function blankRow(missing, ctx) {
  const mine = missing.find((one) => one.id === ctx.shown);
  if (!mine) return "";
  return `<div class="offs"><span class="off-said">${esc(NO_VALUE)}</span>${mine.mark ?? ""}</div>`;
}

/**
 * **자를 잴 때 보는 값 전부.** 그 필드의 모든 subject × 모든 고를 것.
 *
 * `cell` 은 **지금 고른 것**을 읽지만 자는 그것만 보면 안 된다 — 무엇을 누르든 자가
 * 안 움직여야 길이가 뜻을 지킨다. focus 를 옮겨도 자가 안 움직이게 subject 전체로
 * 잰 것과 같은 까닭이고, 고르는 자리가 들어오면서 잴 것이 한 겹 늘었을 뿐이다.
 */
function everyValue(ctx, facet, decl) {
  const out = [];
  for (const subject of ctx.subjects) {
    const slot = ctx.byId.get(subject.id)?.facets?.[facet.id]?.fields?.[decl.key];
    if (!slot) continue;
    for (const entry of slot.byOption ? Object.values(slot.byOption) : [slot]) {
      if (entry?.state === "filled") out.push(entry.value);
    }
  }
  return out;
}

/** 자가 0 이 아닌 값을 길이 0 으로 지우지 않게 두는 바닥. 「값이 없다」와 구별되어야 한다. */
const FLOOR = 0.8;

function readsOf(ctx, facet, decl) {
  return ctx.subjects.map((subject) => ({
    subject: { ...subject, focused: subject.id === ctx.focus },
    ...cell(ctx.byId.get(subject.id), facet.id, decl, ctx.chosen),
  }));
}

/** 값에 붙은 말을 본문 아래에 편다. **고른 subject 것뿐이다** — 말의 규칙은 하나다. */
/**
 * **값에 붙은 말은 어느 element 에서나 같은 자리에 선다** — 라벨 옆 표시를 가리키면 열린다.
 *
 * 겹치는 쪽만 본문 아래에 펴고 있었는데, 그것이 subject 이름을 달고 facet 주석 **위에**
 * 서니 subject 주석처럼 읽혀 순서가 뒤집힌 것처럼 보였다. 화면에 규칙이 둘이었던 것이다.
 * 고른 subject 것만 낸다 — 말의 규칙도 하나다.
 */
function fieldMark(ctx, facet, decl) {
  const { entry } = cell(ctx.byId.get(ctx.shown), facet.id, decl, ctx.chosen);
  return notePop(entry?.notes);
}

/** focus 를 따라 바뀌는 쪽이 지금 그리는 subject. 없으면 첫째다. */
function shownOf(ctx) {
  return ctx.subjects.find((s) => s.id === ctx.shown) ?? null;
}

function oneRead(ctx, facet, decl, subject) {
  return { subject, ...cell(ctx.byId.get(subject.id), facet.id, decl, ctx.chosen) };
}

// ---------------------------------------------------------------- primitive element

/** 값 하나를 크게. focus 가 고른 subject 의 것을 그린다. */
function stat(ctx, facet) {
  const decl = facet.fields[0];
  // **수 하나가 크게 설 자리.** 그 자리의 크기 그대로 비워 둔다.
  if (ctx.subjects.length === 0) {
    return `<div class="field-label">${esc(decl.label ?? decl.key)}${hintMark(decl)}</div>` +
      `<div class="big">${slot("값이 올 자리", decl.type, true)}</div>`;
  }
  const subject = shownOf(ctx);
  if (!subject) return `<div class="blank">${missMark()}</div>`;
  const where = `${facet.id}/${decl.key}/${subject.id}`;
  const { state, entry } = oneRead(ctx, facet, decl, subject);
  const value = state === "filled" ? drawCell(ctx.report, where, decl, entry.value) : missMark();
  return (
    `<div class="field-label">${esc(decl.label ?? decl.key)}${hintMark(decl)}</div>` +
    `<div class="big">${value}${notePop(entry?.notes)}</div>`
  );
}

/** 라벨과 값 여럿. 한 facet 안에 타입이 섞여도 읽는 규칙은 하나다 — 고른 subject 의 것. */
function facts(ctx, facet) {
  // **라벨이 그대로 선다.** 사용자가 선언한 줄들이 이 facet 의 내용이고 지금 보러 온 것이다.
  if (ctx.subjects.length === 0) {
    const empty = facet.fields.map((decl) =>
      `<div class="fact"><dt>${esc(decl.label ?? decl.key)}${hintMark(decl)}</dt>` +
      `<dd>${slot("값이 올 자리", decl.type)}</dd></div>`);
    return `<dl class="facts">${empty.join("")}</dl>`;
  }
  const subject = shownOf(ctx);
  if (!subject) return `<div class="blank">${missMark()}</div>`;
  const rows = facet.fields.map((decl) => {
    const where = `${facet.id}/${decl.key}/${subject.id}`;
    const { state, entry } = oneRead(ctx, facet, decl, subject);
    const value = state === "filled" ? drawCell(ctx.report, where, decl, entry.value) : missMark();
    return (
      `<div class="fact"><dt>${esc(decl.label ?? decl.key)}${hintMark(decl)}</dt>` +
      `<dd>${value}${notePop(entry?.notes)}</dd></div>`
    );
  });
  return `<dl class="facts">${rows.join("")}</dl>`;
}

/** 크기 비교. **자는 subject 전체의 최대값으로 고정한다** — focus 를 옮겨도 길이를 견줄 수 있어야 한다. */
/**
 * 크기 비교. **자는 facet 하나에 하나다.**
 *
 * 필드마다 따로 재면 3등급 1,000만이 1등급 3,000만보다 길어진다 — 그림이 거짓말을 한다.
 * 「한 facet 은 비교 축 하나여야 한다」가 이미 언어의 규칙이니 같은 축이면 같은 자를
 * 쓰는 것이 맞고, 그래야 그 규칙이 **시각으로 강제된다.**
 *
 * 자는 이 facet 의 **모든 필드 × 모든 subject × 모든 고를 것**을 덮는다. 무엇을 누르든
 * 자가 안 움직인다. 범위가 크게 다른 필드가 섞이면 작은 것이 짧아지는데, 그것이
 * **「이 facet 은 축이 둘이다」라는 신호**다 — 감추지 않는다.
 */
function bars(ctx, facet) {
  // **빈 자가 그대로 선다.** `.track` 이 이미 「막대가 여기까지 갈 수 있다」는 자리라
  // 채우지 않은 자만 두면 된다 — 길이 0 의 막대를 그리는 것이 아니다.
  if (ctx.subjects.length === 0) {
    return facet.fields.map((decl) =>
      `<div class="bar-row"><span class="who">${esc(decl.label ?? decl.key)}${hintMark(decl)}</span>` +
      `<span class="track">${wave()}</span>` +
      `<span class="val">${slot("값이 올 자리", decl.type)}</span></div>`).join("");
  }
  const subject = shownOf(ctx);
  if (!subject) return `<div class="blank">${missMark()}</div>`;
  const numbers = facet.fields
    .flatMap((decl) => everyValue(ctx, facet, decl))
    .filter((value) => typeof value === "number" && Number.isFinite(value));
  const top = numbers.length ? Math.max(...numbers) : 0;

  const rows = facet.fields.map((decl) => {
    const where = `${facet.id}/${decl.key}/${subject.id}`;
    const { state, entry } = oneRead(ctx, facet, decl, subject);
    let mark = '<span class="track"></span>';
    let text;
    if (state !== "filled") {
      text = missMark();
    } else if (typeof entry.value === "number" && Number.isFinite(entry.value)) {
      // 0 은 길이 0 이다 — 진짜 0 이니까. 0 이 아닌 값은 바닥을 둔다: 길이 0 으로
      // 사라지면 「값이 없다」와 구별이 안 된다. 정확한 수는 옆에 늘 적혀 있다.
      const share = top > 0 && entry.value > 0 ? (entry.value / top) * 100 : 0;
      const width = share > 0 ? Math.max(share, FLOOR) : 0;
      mark = `<span class="track"><span class="fill" style="width:${width.toFixed(4)}%"></span></span>`;
      text = esc(formatScalar(decl.type, entry.value));
    } else {
      text = undrawable(ctx.report, where, "막대는 수를 요구한다", JSON.stringify(entry.value));
    }
    return (
      // **이름 옆은 hint, 값 옆은 그 값에 대한 말.** 자리가 뜻을 가른다.
      `<div class="bar-row"><span class="who">${esc(decl.label ?? decl.key)}` +
      `${hintMark(decl)}</span>${mark}<span class="val">${text}${notePop(entry?.notes)}</span></div>`
    );
  });
  return rows.join("");
}

function line(ctx, facet) {
  const decl = facet.fields[0];
  const axis = decl.axis;
  const series = [];
  const missing = []; // 값이 없어 못 그린 subject — 줄 머리가 한 번 말한다
  const broken = []; // 값은 있으나 그리지 못한 것 — 저마다 까닭을 적는다
  for (const subject of ctx.subjects) {
    const { state, entry } = cell(ctx.byId.get(subject.id), facet.id, decl, ctx.chosen);
    const where = `${facet.id}/${decl.key}/${subject.id}`;
    if (state !== "filled") {
      missing.push({ ...subject, mark: notePop(entry?.notes) });
      continue;
    }
    const raw = entry.value;
    const points = [];
    let bad = null;
    if (!Array.isArray(raw)) bad = "선은 점의 배열을 요구한다";
    else
      for (const point of raw) {
        const x = axisNumber(axis, point?.at);
        const y = typeof point?.value === "number" && Number.isFinite(point.value) ? point.value : null;
        if (x === null || y === null) {
          bad = `축(${axis ?? "없음"})이나 값에 그릴 수 없는 것이 있다`;
          break;
        }
        points.push({ x, y, at: point.at });
      }
    if (bad || points.length === 0) {
      broken.push(
        `<span class="off${subject.id === ctx.focus ? " is-focus" : ""}">` +
          `<b class="who">${esc(subject.name)}</b> ` +
          `${undrawable(ctx.report, where, bad ?? "점이 하나도 없다", JSON.stringify(raw).slice(0, 80))}</span>`,
      );
      continue;
    }
    series.push({ subject, points, notes: entry.notes });
  }
  // **그림도 표처럼 자기 상자에서 굴러간다.** 좁은 화면에서 통째로 줄이면 축 라벨과 선 끝
  // 이름이 읽을 수 없게 작아진다 — 그림은 제 크기를 지키고 상자가 굴러간다.
  // **자는 고를 것까지 덮는다.** 축을 옮겨도 그림의 자가 안 움직여야 앞뒤를 견줄 수 있다.
  const span = { x: [], y: [] };
  for (const value of everyValue(ctx, facet, decl)) {
    if (!Array.isArray(value)) continue;
    for (const point of value) {
      const x = axisNumber(axis, point?.at);
      const y = typeof point?.value === "number" && Number.isFinite(point.value) ? point.value : null;
      if (x !== null && y !== null) { span.x.push({ x, at: point.at }); span.y.push(y); }
    }
  }
  // **축만 남는다.** 값이 없으면 눈금도 없다 — 눈금을 지어내면 그것이 가짜 값이다.
  // 두 축이 서는 것만으로 「여기에 선이 그려진다」가 읽힌다.
  const body = ctx.subjects.length === 0
    ? `<div class="chart-scroll">${emptyAxes()}</div>`
    : series.length
      ? `<div class="chart-scroll">${lineSvg(series, axis, decl.type, ctx.focus, ctx.prior, span)}</div>`
      : `<div class="blank">${missMark()}</div>`;
  return (
    // 값에 붙은 말은 다른 element 와 같은 자리에 — 라벨 옆 표시를 가리키면 열린다.
    // 값이 설 한 자리가 없는 element 다 — 값 주석 표시가 이름 줄에 함께 선다.
    // 앞이 hint, 뒤가 값 주석. 차례가 고정이라 여는 것이 무엇인지 갈린다.
    `<div class="field-label">${esc(decl.label ?? decl.key)}${hintMark(decl)}` +
    `${fieldMark(ctx, facet, decl)}</div>` + body +
    // 선 끝에 이름이 붙으므로 **아래에 범례를 두지 않는다.** 고른 것이 못 섰을 때만 말한다.
    blankRow(missing, ctx) +
    // 어긋난 값은 범례가 아니라 결함 신호다. 누구 것인지 적어야 고칠 수 있어 전원을 낸다.
    (broken.length ? `<div class="offs">${broken.join("")}</div>` : "")
  );
}

/**
 * 그림 한 장의 자 — viewBox 와 네 여백. **이 저장소에서 한 번만 적는다.**
 *
 * 값이 있는 그림과 아직 아무도 없는 축이 같은 자를 써야 자리가 안 흔들린다. 뷰어가 갈아 끼울
 * 모양의 좌표도 여기서 나온다 — 스타일시트는 그 좌표를 옮겨 적기만 하고 제 수를 두지 않는다.
 */
const CHART = { W: 760, H: 240, L: 78, R: 130, T: 18, B: 34 };

/** 꼭짓점 목록을 꺾은선 path 로. **이 한 줄이 폴리라인과 path 의 같은 모양을 보증한다.** */
const MORPH_PATH = (corners) => `M ${corners.join(" L ")}`;

/**
 * 아직 아무도 오지 않은 축. **눈금도 수도 이름도 없다** — 그 셋 가운데 하나라도 붙으면
 * 그 모양이 값이 된다. 그것이 값이 되는 유일한 길이라 셋을 다 막는다.
 *
 * 꺾은선을 **하나로 낸다.** 실제 `line` 이 꺾은선이니 자리도 그 모양이어야 하고, 한 선이
 * 다음 모양으로 **이어서 흘러간다** — 끊었다 다시 나타나면 그 사이가 빈 자리로 읽힌다.
 * 한 모양이 고정되면 그것이 「이 subject 의 선」으로 읽히지만, 끊임없이 변형되면 어느 것도
 * 그렇게 읽히지 않는다. **흘리는 것은 뷰어의 일이라 여기엔 시간도 프레임도 없다.**
 *
 * 꼭짓점 수가 같은 `<polyline>` 넷도 함께 낸다. `d` 를 못 받는 브라우저에서 그 넷을 교대시키면
 * 선이 아예 안 보이는 자리가 생기지 않는다 — 어느 쪽을 세울지는 뷰어의 `@supports` 가 고른다.
 */
function emptyAxes() {
  const { W, H, L, R, T, B } = CHART;
  const span = W - R - L, top = T + 12, bottom = H - B - 12;
  // **정해진 수에서 나온 모양이다.** 값에서 오지 않으므로 무엇을 그려도 값이 아니다.
  const SHAPES = [
    [0.62, 0.28, 0.74, 0.41, 0.18, 0.55, 0.33],
    [0.24, 0.66, 0.35, 0.82, 0.47, 0.21, 0.59],
    [0.81, 0.44, 0.19, 0.63, 0.72, 0.36, 0.88],
    [0.37, 0.52, 0.88, 0.26, 0.61, 0.79, 0.44],
  ];
  const cornersOf = (ys) => ys.map((y, i) =>
    `${(L + (span * i) / (ys.length - 1)).toFixed(1)},${(bottom - (bottom - top) * y).toFixed(1)}`);
  const shapes = SHAPES.map((ys) => `<polyline class="wave" points="${cornersOf(ys).join(" ")}"/>`);
  // 흐르는 선은 **첫 모양으로 선다.** 다음 모양으로 옮기는 것은 뷰어이고, 그 좌표는
  // 여기 꼭짓점을 그대로 옮겨 적은 것이라 고정 케이스가 둘을 대조한다.
  const morph = `<path class="wave wave-morph" d="${MORPH_PATH(cornersOf(SHAPES[0]))}"/>`;
  return (
    `<svg class="line" viewBox="0 0 ${W} ${H}" role="img" aria-label="선이 올 자리">` +
    `${shapes.join("")}${morph}` +
    `<line class="axis" x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}"/>` +
    `<line class="axis" x1="${L}" y1="${T}" x2="${L}" y2="${H - B}"/></svg>`
  );
}

function lineSvg(series, axis, type, focus, prior, span) {
  const { W, H, L, R, T, B } = CHART;
  // **그린 것이 아니라 잴 것 전부로 자를 잡는다** — 무엇을 눌러도 축이 안 움직인다.
  const edge = span.x.length ? span.x : series.flatMap((s) => s.points.map((p) => ({ x: p.x, at: p.at })));
  const xs = edge.map((one) => one.x);
  const ys = span.y.length ? span.y : series.flatMap((s) => s.points.map((p) => p.y));
  const xmin = Math.min(...xs), xmax = Math.max(...xs);
  const ymin = Math.min(...ys, 0), ymax = Math.max(...ys);
  const xspan = xmax - xmin || 1;
  const yspan = ymax - ymin || 1;
  const px = (x) => L + ((x - xmin) / xspan) * (W - L - R);
  const py = (y) => H - B - ((y - ymin) / yspan) * (H - T - B);

  // 축 양끝의 글도 자에서 온다 — 그린 것만 보면 눌렀을 때 눈금이 달라진다.
  const firstAt = edge.reduce((a, p) => (p.x < a.x ? p : a), edge[0]).at;
  const lastAt = edge.reduce((a, p) => (p.x > a.x ? p : a), edge[0]).at;

  const parts = [
    `<line class="axis" x1="${L}" y1="${py(ymin).toFixed(1)}" x2="${W - R}" y2="${py(ymin).toFixed(1)}"/>`,
    `<line class="axis" x1="${L}" y1="${T}" x2="${L}" y2="${H - B}"/>`,
    `<text class="tick ty" x="${L - 8}" y="${py(ymax).toFixed(1)}">${esc(formatScalar(type, ymax))}</text>`,
    `<text class="tick ty" x="${L - 8}" y="${py(ymin).toFixed(1)}">${esc(formatScalar(type, ymin))}</text>`,
    `<text class="tick tx" x="${L}" y="${H - B + 18}">${esc(formatScalar(axis, firstAt))}</text>`,
    `<text class="tick tx end" x="${W - R}" y="${H - B + 18}">${esc(formatScalar(axis, lastAt))}</text>`,
  ];
  series.forEach(({ subject, points }) => {
    const focused = subject.id === focus;
    // 무늬를 쓰지 않는다. 갈래는 상태에서 나오고 CSS 가 색·굵기·진하기로 함께 말한다.
    const klass = `series trace-${traceOf(subject.id, focus, prior)}${focused ? " is-focus" : ""}`;
    if (points.length === 1) {
      parts.push(`<circle class="${klass}" cx="${px(points[0].x).toFixed(1)}" cy="${py(points[0].y).toFixed(1)}" r="3.5"/>`);
    } else {
      const coords = points.map((p) => `${px(p.x).toFixed(1)},${py(p.y).toFixed(1)}`).join(" ");
      parts.push(`<polyline class="${klass}" points="${coords}"/>`);
    }
    for (const p of points) {
      parts.push(`<circle class="dot ${klass}" cx="${px(p.x).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="2.5"/>`);
    }
    const last = points[points.length - 1];
    parts.push(
      `<text class="series-label trace-${traceOf(subject.id, focus, prior)}${focused ? " is-focus" : ""}" ` +
        `x="${(px(last.x) + 8).toFixed(1)}" y="${(py(last.y) + 4).toFixed(1)}">${esc(subject.name)}</text>`,
    );
  });
  return `<svg class="line" viewBox="0 0 ${W} ${H}" role="img">${parts.join("")}</svg>`;
}

/**
 * 겹치는 좌표가 **항목**이다. subject 마다 표를 따로 두지 않고 목록을 하나로 합친다 —
 * 누가 무엇을 갖고 누가 안 갖는지가 한 줄에서 읽힌다.
 * 한 항목의 여러 열은 하나의 자로 줄일 수 없어 그 안에서만 나란히 선다 (원칙 9).
 */
function list(ctx, facet) {
  const decl = facet.fields[0];
  const columns = Array.isArray(decl.columns) ? decl.columns : [];
  if (columns.length === 0) return `<div class="blank">${missMark()}</div>`;
  const [key, ...rest] = columns;

  const reads = readsOf(ctx, facet, decl);
  const rows = new Map(); // 항목 이름 → subjectId → 항목
  const unread = new Set(); // 목록 자체를 못 읽은 subject
  for (const { subject, state, entry } of reads) {
    if (state !== "filled" || !Array.isArray(entry.value)) {
      unread.add(subject.id);
      continue;
    }
    for (const item of entry.value) {
      const name = item?.[key.key];
      if (name === undefined) continue;
      const at = String(name);
      if (!rows.has(at)) rows.set(at, new Map());
      rows.get(at).set(subject.id, item);
    }
  }

  const blanks = reads
    .filter(({ subject }) => unread.has(subject.id))
    .map(({ subject }) => ({ ...subject }));
  // list 는 값이 subject 열에 선다 — 값 주석 표시는 그 열 머리로 간다.
  const label = `<div class="field-label">${esc(decl.label ?? decl.key)}${hintMark(decl)}</div>`;
  // **열은 subject 가 만든다.** 아직 아무도 없으니 키 열만 서고 그 옆 한 칸이
  // 「subject 가 오면 여기에 한 열씩 선다」는 자리로 비어 있는다. 이름을 지어내지 않는다.
  // **도메인 말을 쓰지 않는다** — 이 글은 산출물에 실려 나가는 계약 면이다.
  if (ctx.subjects.length === 0) {
    return (
      label +
      `<div class="table-scroll"><table class="items"><colgroup><col><col></colgroup>` +
      `<thead><tr><th class="corner">${esc(key.label ?? key.key)}</th>` +
      `<th>${slot("subject 가 올 자리", key.type)}</th></tr></thead>` +
      `<tbody><tr><th class="row-label" scope="row">${slot("항목이 올 자리", key.type)}</th>` +
      `<td>${rest.map((c) => slot("값이 올 자리", c.type)).join("") || slot()}</td>` +
      `</tr></tbody></table></div>`
    );
  }
  if (rows.size === 0) {
    return label +
      // 목록 **전체**가 비었다는 말은 값 하나의 자리가 아니라 표가 설 자리다. 글로 선다.
      `<div class="blank"><span class="miss">${NO_ITEMS}</span></div>${blankRow(blanks, ctx)}`;
  }

  // **고른 열은 통째로 잡는다.** 칸마다 테두리를 두르면 열 안에 가로선이 생겨 한 덩어리로
  // 읽히지 않는다. 열 선언(`<col>`)에 테두리를 주면 머리부터 끝까지 한 상자가 된다.
  const cols = [`<col>`, ...reads.map(({ subject }) => (subject.focused ? `<col class="is-focus">` : `<col>`))];
  const head = [`<th class="corner">${esc(key.label ?? key.key)}</th>`];
  for (const { subject } of reads) {
    const said = subject.id === ctx.shown ? fieldMark(ctx, facet, decl) : "";
    head.push(`<th>${esc(subject.name)}${said}</th>`);
  }
  const body = [...rows.entries()].map(([name, held]) => {
    const cells = reads.map(({ subject }) => {
      if (unread.has(subject.id)) return `<td>${missMark()}</td>`;
      const item = held.get(subject.id);
      // **아는 사실이라 글이 선다.** 목록을 읽었고 그 항목이 여기 없다 — 모르는 것이 아니다.
      if (!item) return `<td><span class="miss">${esc(NO_ITEM)}</span></td>`;
      const pairs = rest.map((column) =>
        column.key in item
          ? `<span class="cell-pair"><b class="who">${esc(column.label ?? column.key)}</b> ${esc(formatScalar(column.type, item[column.key]))}</span>`
          : "",
      );
      const extra = Object.keys(item).filter((k) => !columns.some((c) => c.key === k));
      if (extra.length) ctx.report.push(`${facet.id}/${name}: 템플릿에 없는 열이라 그리지 않았다 — ${extra.join(", ")}`);
      // **있다는 것은 없다는 것이 아니다.** 표기는 빈 자리를 가리키는 것이라 여기엔 글이 선다.
      return `<td>${pairs.join("") || '<span class="miss">있음</span>'}</td>`;
    });
    return `<tr><th class="row-label" scope="row">${esc(name)}</th>${cells.join("")}</tr>`;
  });

  return (
    label +
    // **표만 옆으로 굴린다.** subject 가 늘수록 넓어지는 유일한 자리라, 페이지 전체가 밀리는
    // 대신 표가 자기 상자 안에서 굴러간다. 열 너비는 균일하다 — 넓이가 우열을 말하지 않는다.
    `<div class="table-scroll"><table class="items"><colgroup>${cols.join("")}</colgroup>` +
    `<thead><tr>${head.join("")}</tr></thead>` +
    `<tbody>${body.join("")}</tbody></table></div>`
    // 문장을 덧붙이지 않는다 — 그 subject 의 칸이 이미 없다고 말한다.
  );
}

/**
 * **고른 subject 의 항목을 행으로 편다.** `list` 와 같은 값(항목 배열)을 받지만 비교하는
 * 법이 다르다 — `list` 는 여럿을 한 표에 겹치고, `rows` 는 지금 보고 있는 하나만 편다.
 *
 * 둘을 한 element 로 두고 템플릿이 고르게 하면 「비교 방법은 primitive element 가 정한다」가
 * 깨진다. 같은 이름이 화면마다 다르게 굴면 이름만 보고 알 수 없다. 그래서 이름을 가른다.
 */
function rows(ctx, facet) {
  const decl = facet.fields[0];
  const columns = Array.isArray(decl.columns) ? decl.columns : [];
  if (columns.length === 0) return `<div class="blank">${missMark()}</div>`;
  const subject = shownOf(ctx);
  // rows 도 값이 설 한 자리가 없다 — 이름 줄에 hint 다음으로 선다.
  const label = `<div class="field-label">${esc(decl.label ?? decl.key)}${hintMark(decl)}` +
    `${fieldMark(ctx, facet, decl)}</div>`;
  // **열 머리가 전부 선다.** 열은 템플릿이 선언한 것이라 subject 가 없어도 안다 —
  // 사용자가 무엇을 담기로 했는지가 여기서 그대로 읽힌다.
  if (ctx.subjects.length === 0) {
    const head = columns.map((c) => `<th>${esc(c.label ?? c.key)}</th>`).join("");
    const blank = columns.map((c) => `<td>${slot("값이 올 자리", c.type)}</td>`).join("");
    return (
      label +
      `<div class="table-scroll"><table class="items"><thead><tr>${head}</tr></thead>` +
      `<tbody><tr>${blank}</tr></tbody></table></div>`
    );
  }
  if (!subject) return `${label}<div class="blank">${missMark()}</div>`;

  const { state, entry } = oneRead(ctx, facet, decl, subject);
  if (state !== "filled" || !Array.isArray(entry.value)) {
    return `${label}<div class="blank">${missMark()}</div>`;
  }
  if (entry.value.length === 0) {
    return `${label}<div class="blank"><span class="miss">${NO_ITEMS}</span></div>`;
  }
  const head = columns.map((c) => `<th>${esc(c.label ?? c.key)}</th>`).join("");
  const body = entry.value.map((item, index) => {
    const extra = Object.keys(item ?? {}).filter((k) => !columns.some((c) => c.key === k));
    if (extra.length) ctx.report.push(`${facet.id}[${index}]: 템플릿에 없는 열이라 그리지 않았다 — ${extra.join(", ")}`);
    const cells = columns.map((column) =>
      column.key in (item ?? {})
        ? `<td>${esc(formatScalar(column.type, item[column.key]))}</td>`
        : `<td>${missMark()}</td>`,
    );
    return `<tr>${cells.join("")}</tr>`;
  });
  return (
    label +
    // 표는 자기 상자에서 굴러간다. 열이 늘어도 페이지가 밀리지 않는다.
    `<div class="table-scroll"><table class="items"><thead><tr>${head}</tr></thead>` +
    `<tbody>${body.join("")}</tbody></table></div>`
  );
}

/**
 * **하나를 쪼갠 것.** 조각들이 합쳐 한 덩어리가 된다 — 「내 보험료가 어디에 쓰이나」.
 *
 * `bars` 와 다르다. 막대는 **서로 다른 것들의 크기**를 견주고, 여기 조각들은 **한 덩어리의
 * 안쪽**이다. 합이 전체라는 사실이 `bars` 로는 보이지 않는다.
 *
 * **겹칠 수 없다** — 한 subject 의 안을 나눈 것이라 두 subject 의 안이 한 덩어리가 될 수
 * 없다. 그래서 focus 를 따른다.
 *
 * **파이가 아니라 띠로 그린다.** 우리는 색으로 가르지 않는데, 색 없는 파이는 조각을 가를
 * 길이 각도뿐이라 읽히지 않는다. 띠는 조각마다 이름을 옆에 세울 수 있고 길이가 각도보다
 * 정확히 읽힌다. 조각은 자리 차례로 두 무채색을 번갈아 쓴다 — 크기와 무관하고 우열이 없다.
 */
function parts(ctx, facet) {
  const decl = facet.fields[0];
  const columns = Array.isArray(decl.columns) ? decl.columns : [];
  const subject = shownOf(ctx);
  const label = `<div class="field-label">${esc(decl.label ?? decl.key)}${hintMark(decl)}` +
    `${fieldMark(ctx, facet, decl)}</div>`;
  if (columns.length < 2) return `${label}<div class="blank">${missMark()}</div>`;
  const [name, share] = columns;
  // **빈 띠가 자리를 말한다.** 조각의 이름은 값이 갖고 오는 것이라 지어내지 않는다.
  if (ctx.subjects.length === 0) {
    return `${label}<div class="band" role="img" aria-label="조각이 올 자리">${wave()}</div>`;
  }
  if (!subject) return `${label}<div class="blank">${missMark()}</div>`;

  const { state, entry } = oneRead(ctx, facet, decl, subject);
  if (state !== "filled" || !Array.isArray(entry.value)) {
    return `${label}<div class="blank">${missMark()}</div>`;
  }
  // **0 인 조각도 목록에 남는다.** 띠에서 사라진다고 값까지 사라지면 안 된다 —
  // 「0 원이다」와 「그런 조각이 없다」는 다른 말이다.
  const all = entry.value
    .map((item) => ({ said: item?.[name.key], size: item?.[share.key] }))
    .filter((one) => typeof one.size === "number" && Number.isFinite(one.size));
  const slices = all.filter((one) => one.size > 0);
  if (all.length === 0) {
    return `${label}<div class="blank"><span class="miss">${NO_ITEMS}</span></div>`;
  }
  const whole = slices.reduce((sum, one) => sum + one.size, 0);
  const band = slices
    .map((one) =>
      // 조각도 바닥을 둔다 — 0 이 아닌 몫이 길이 0 으로 사라지면 없는 것과 같아진다.
      `<span class="slice" style="width:${Math.max((one.size / whole) * 100, FLOOR).toFixed(4)}%" ` +
      `title="${esc(one.said ?? "")}"></span>`)
    .join("");
  const rows = all
    .map((one) =>
      `<div class="slice-row"><span class="who">${esc(one.said ?? "")}</span>` +
      `<span class="val">${esc(formatScalar(share.type, one.size))}</span></div>`)
    .join("");
  return (
    label +
    (slices.length ? `<div class="band">${band}</div>` : "") +
    `<div class="slices">${rows}</div>`
  );
}

const ELEMENTS = { stat, facts, bars, line, list, rows, parts };

// ---------------------------------------------------------------- 페이지

/**
 * **facet 이 타는 축의 선택자가 설 자리.**
 *
 * 축은 그 facet 이 **무엇에 대한 값인지**를 말한다 — 그래서 facet 의 내용이고 렌더가 낸다.
 * 화면 전체에 걸리는 것(focus·명단·상태 줄)은 여전히 껍데기라 밖에 남는다. 선이 거기다.
 *
 * **어느 축을 타는지는 facet 이 제 필드로 말한다** — 따로 적지 않는다. 두 군데 적으면
 * 어긋날 수 있고, 필드가 이미 말한 것을 되풀이하는 것뿐이다.
 *
 * **모양은 말하지 않는다.** 고를 것과 고른 것을 자리로 낼 뿐, 칩인지 드롭다운인지는 앱이
 * 제 것으로 갈아 끼운다 — 꼴을 가리키는 이름을 붙이지 않는다.
 *
 * 타는 facet 마다 제 선택자를 낸다. 첫 facet 에만 두면 나머지 둘이 까닭 없이 바뀌고
 * facet 차례가 뜻을 지게 된다 — 그러면 차례가 배치일 뿐이라는 규칙이 깨진다.
 */
function choiceSlots(facet, picks, chosen) {
  const rides = [];
  for (const decl of facet.fields ?? []) {
    if (decl?.choice && !rides.includes(decl.choice)) rides.push(decl.choice);
  }
  return rides
    .map((id) => picks.find((one) => one.id === id))
    .filter(Boolean)
    .map((pick) => {
      const buttons = (pick.options ?? []).map((option) =>
        `<button type="button" data-option="${esc(option.id)}" ` +
        `aria-pressed="${option.id === chosen[pick.id]}">${esc(option.label ?? option.id)}</button>`,
      );
      return (
        `<div class="choice" data-choice="${esc(pick.id)}" role="group" ` +
        `aria-label="${esc(pick.label ?? pick.id)}">${buttons.join("")}</div>`
      );
    })
    .join("");
}

/** 뷰어가 왼쪽에 적을 것. **분석뷰에 섞이지 않는다.** 자리 계산이 두 벌이 되지 않게 여기서 낸다. */
function viewState(seats, focus, prior, shown, wanted, picks) {
  return {
    seats,
    // 고를 수 있는 것과 고른 것. **앱이 그 자리를 그린다** — 모양은 언어가 말하지 않고
    // 분석뷰에도 들어가지 않는다. 우리가 내는 것은 무엇을 고를 수 있는가뿐이다.
    ...picks,
    shown, // focus 를 따라 바뀌는 element 가 지금 그리는 subject

    focus,
    prior, // 직전에 보고 있던 subject. 겹치는 선이 갈래를 여기서 받는다
    // 없는 id 는 결함이 아니다. 분석뷰는 focus 를 놓은 것과 똑같고, 그 사실만 왼쪽이 알린다.
    focusMissing: wanted && !focus ? wanted : null,
  };
}

/**
 * 분석뷰 하나를 HTML 로 그린다.
 *
 * @param {object} input  { template, values, focus, previousFocus }
 *   - 자리와 그 차례는 **값 한 벌들이 정한다.** 명단을 따로 받지 않는다.
 *   - focus 는 subject 의 id. null 이거나 없는 id 면 겹치는 element 는 강조를 풀고,
 *     focus 를 따라 바뀌는 element 는 **첫 subject** 를 그린다.
 *   - previousFocus 는 바로 전에 보고 있던 subject. **값에서 유도할 수 없어** 인자로 받는다.
 *     같은 규칙이다 — 없는 id 면 그 상태만 사라지고, focus 와 같으면 직전이 없는 것으로 본다.
 *   - choices 는 고르는 자리마다 무엇을 골랐는지의 지도. 빠졌거나 없는 id 면 **첫 option**.
 *     고른 것이 바뀌면 값이 바뀔 뿐 **어떤 facet 이 서는지는 달라지지 않는다.**
 * @returns {{html: string, report: string[], view: object|null}}
 *   html 은 **분석뷰뿐**이다 — 템플릿 제목과 facet 들. 도구가 덧붙이는 것은 하나도 들어가지 않는다.
 *   report 는 그리지 못한 자리들, view 는 뷰어가 왼쪽에 적을 화면 상태.
 */
function renderView({
  template,
  values = [],
  focus = null,
  previousFocus = null,
  choices = null,
} = {}) {
  const report = [];
  if (!template || typeof template !== "object" || Array.isArray(template)) {
    // 그릴 분석뷰가 없다. 빈 판을 내고 무슨 일인지는 왼쪽이 말한다.
    return { html: "", report: ["템플릿이 객체가 아니다"], view: null };
  }
  const byId = new Map();
  for (const doc of values) {
    if (doc && typeof doc === "object" && typeof doc.subjectId === "string") byId.set(doc.subjectId, doc);
    else report.push("값 한 벌에 subjectId 가 없어 어느 subject 인지 알 수 없다");
    if (doc?.templateId && template.id && doc.templateId !== template.id) {
      report.push(`${doc.subjectId}: 값 한 벌의 templateId 가 템플릿과 다르다 (${doc.templateId} ≠ ${template.id})`);
    }
  }

  // 자리는 값 한 벌들이 정한다. 차례는 넘어온 차례이고 배치일 뿐 우열이 아니다.
  // **자리에 색을 붙이지 않는다.** subject 를 가르는 것은 이름이고, 겹치는 선은 무늬다.
  const seats = [...byId.entries()].map(([id, doc]) => ({ id, name: doc.subjectLabel || id }));

  // **고르는 자리.** 무엇을 고를 수 있는지는 템플릿이 말한다 — 골격이라 subject 마다
  // 달라서는 안 된다. **고른 것만** 사람이 누른 것이라 인자로 온다.
  // 빠졌거나 없는 id 면 첫 option 이다 — 빈 화면을 내지 않는다.
  const picks = Array.isArray(template.choices) ? template.choices.filter((c) => c?.id) : [];
  const chosen = {};
  for (const one of picks) {
    const options = Array.isArray(one.options) ? one.options : [];
    const wantedOption = choices?.[one.id];
    chosen[one.id] = options.find((o) => o?.id === wantedOption)?.id ?? options[0]?.id ?? null;
  }

  const wanted = focus;
  const seated = seats.some((s) => s.id === wanted) ? wanted : null;
  // focus 를 따라 바뀌는 element 가 그릴 subject. 고른 것이 없으면 첫째다 —
  // 늘어놓기로 돌아가지 않고 빈 화면도 내지 않는다.
  const shown = seated ?? seats[0]?.id ?? null;
  // 직전도 같은 규칙이다 — 없는 id 면 사라지고, 현재와 같으면 직전이 없는 것으로 본다.
  const prior = seats.some((s) => s.id === previousFocus) && previousFocus !== seated
    ? previousFocus
    : null;
  const ctx = { subjects: seats, byId, focus: seated, prior, shown, chosen, report };

  for (const [id, doc] of byId) {
    const known = new Set((template.facets ?? []).map((f) => f?.id));
    for (const key of Object.keys(doc.facets ?? {})) {
      if (!known.has(key)) report.push(`${id}: 템플릿에 없는 facet 이라 그리지 않았다 — ${key}`);
    }
  }

  const facets = Array.isArray(template.facets) ? template.facets : [];
  if (facets.length === 0) report.push("템플릿에 facet 이 하나도 없다");

  /**
   * **아무에게도 값이 없고 할 말도 없는 facet 은 서지 않는다.**
   *
   * 선이 어디인지가 중요하다. subject **하나**가 비는 것은 그대로 표기가 말한다 — 숨기면
   * subject 마다 골격이 달라져 견줄 수 없다. **전원이 비었을 때만** 빠진다: 견줄 것이
   * 없으니 골격이 달라질 일도 없고, 남는 것은 빈 카드뿐이다.
   *
   * 다만 **말이 붙어 있으면 선다.** 「이 제안서엔 이 항목이 없습니다」라고 적힌 카드는
   * 빈 카드가 아니다 — 전부 비어 있는 값 한 벌이 「아직 분석하지 않았다」를 말하는 길이
   * 그것이라, 말까지 지우면 그 자리가 사라진다.
   *
   * subject 가 하나도 없으면 이 규칙을 쓰지 않는다. 견줄 대상이 없는 것과 전원이 빈 것은
   * 다르다 — 템플릿만으로 골격을 보는 자리가 남아야 한다.
   */
  const stands = (facet) => {
    if (seats.length === 0 || !facet || typeof facet !== "object") return true;
    if ((facet.notes ?? []).length > 0) return true;
    for (const seat of seats) {
      const doc = byId.get(seat.id);
      if (facetNotes(doc, facet.id).length > 0) return true;
      for (const decl of facet.fields ?? []) {
        if (!decl || typeof decl.key !== "string") return true; // 그리지 못하는 것은 말해야 한다
        const { state, entry } = cell(doc, facet.id, decl, chosen);
        if (state === "filled" || (entry?.notes ?? []).length > 0) return true;
      }
    }
    return false;
  };
  const dropped = facets.filter((facet) => !stands(facet)).map((facet, i) => facet?.id ?? `facets[${i}]`);

  const sections = facets.filter(stands).map((facet, index) => {
    const at = `facets[${index}]`;
    if (!facet || typeof facet !== "object") {
      return `<section class="facet broken">${undrawable(report, at, "facet 이 객체가 아니다")}</section>`;
    }
    const title = esc(facet.title ?? facet.id ?? at);
    const draw = ELEMENTS[facet.element];
    // primitive element 이름은 분석뷰에 나올 자리가 없다. 구조로만 남긴다 —
    // 참조 뷰어의 배지는 이 속성을 읽어 CSS 가 그리므로 렌더가 낸 글에는 들어가지 않는다.
    // **제목은 짧은 이름이고 설명은 hint 가 진다.** facet 은 화면에 서넛뿐이라 한 줄씩
    // 붙어도 길어지지 않는다 — 필드가 열 개씩이라 표시 뒤로 숨긴 것과 갈리는 자리다.
    const head = `<h2 data-element="${esc(facet.element ?? "")}">${title}</h2>` +
      (facet.hint ? `<p class="facet-hint">${esc(facet.hint)}</p>` : "");
    let body;
    if (!draw) {
      body = undrawable(report, facet.id ?? at, `모르는 primitive element 다 — ${JSON.stringify(facet.element)}`);
    } else if (!Array.isArray(facet.fields) || facet.fields.length === 0) {
      body = undrawable(report, facet.id ?? at, "필드가 하나도 없다");
    } else if (facet.fields.some((f) => !f || typeof f.key !== "string")) {
      body = undrawable(report, facet.id ?? at, "key 가 없는 필드가 있다");
    } else {
      body = draw(ctx, facet);
    }
    // **말은 데이터 뒤에 선다.** facet 에 붙은 것과 subject 에 붙은 것이 한자리에 모인다 —
    // 예외를 두지 않는다. 읽는 규칙이 둘이면 매번 어디 있는지 찾게 된다.
    // 둘을 가르는 것은 띠도 상자도 아니고 **자리와 글**이다: subject 것은 이름이 앞에 선다.
    //
    // **subject 의 말은 언제나 고른 subject 것이다.** element 로 갈리지 않는다 — 규칙이 하나다.
    // 겹쳐 그리는 facet 이라도 아래에 서는 말은 지금 고른 subject 것이고, focus 를 옮기면
    // 말이 따라온다. 고른 것이 없으면 첫 subject 이며, 그것이 화면이 그리고 있는 subject 다.
    // **facet 에 붙은 말은 전부 선다** — 그건 subject 의 것이 아니다.
    const mine = seats.find((s) => s.id === shown);
    // **이름표를 붙이지 않는다.** 주석은 늘 고른 subject 것만 나오므로 이름이 그 사실을 두 번
    // 말한다. 무엇을 고른 상태인지는 앱의 띠가 말하고, 두 묶음을 가르는 일은 짧은 선이 맡는다.
    // (되돌리려면 아래 호출에 `mine.name` 을 둘째 인자로 다시 주면 된다.)
    const ours = notesHtml(facet.notes);
    const yours = mine ? notesHtml(facetNotes(byId.get(mine.id), facet.id)) : "";
    // **두 묶음 사이에만 짧은 선이 선다.** 이름이 가르는 것을 거들 뿐이라 판을 가로지르지
    // 않고 글머리 쪽에 짧게 놓인다. 가를 것이 없으면(한쪽이 비면) 서지 않는다.
    // 줄과 같은 자로 재어진다 — 앞뒤 간격이 `--row` 하나다.
    const cut = ours && yours ? `<hr class="said-cut">` : "";
    const said = ours + cut + yours;
    return (
      `<section class="facet element-${esc(facet.element ?? "unknown")}">${head}` +
      // 축은 제목 바로 아래 — 이 facet 이 무엇에 대한 값인지를 먼저 말하고 그 값을 그린다.
      choiceSlots(facet, picks, chosen) +
      `<div class="body">${body}</div>` +
      (said ? `<div class="said">${said}</div>` : "") +
      "</section>"
    );
  });

  // 제목은 템플릿이 선언한 내용이라 렌더의 것이다. 그 밖의 머리말은 전부 뷰어 몫이다.
  const html = `<h1>${esc(template.title ?? template.id ?? "제목 없음")}</h1>` + sections.join("");

  return {
    html,
    report,
    view: viewState(seats, seated, prior, shown, wanted, { choices: picks, chosen, dropped }),
  };
}
