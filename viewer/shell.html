<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>weave 참조 뷰어</title>
<!--
  이 파일은 tools/build_viewer.py 가 viewer/ 와 samples/ 에서 만든다. 손으로 고치지 않는다.
  의존성이 없다 — CDN 도 서버도 쓰지 않는다. 파일을 브라우저로 열면 바로 돈다.
-->
<style>
/*__STYLE__*/
</style>
</head>
<body>
<div class="shell">
  <div class="pane edit">
    <div class="bar">
      <h1>weave 참조 뷰어</h1>
      <label for="sample">샘플</label>
      <select id="sample"></select>
      <button type="button" id="add-values">＋ 값 한 벌</button>
      <button type="button" id="drop-values">－ 이 값 한 벌</button>
    </div>
    <div class="bar">
      <label>focus</label>
      <span id="focus-buttons"></span>
      <input type="text" id="focus-free" placeholder="없는 id 를 넣어 본다" size="18">
    </div>
    <p class="about" id="about"></p>
    <div class="tabs" id="tabs"></div>
    <textarea id="editor" spellcheck="false" autocomplete="off"></textarea>
    <div class="strip" id="strip"></div>
    <p class="about">
      여기는 JSON 으로 읽히는지만 본다. <b>스키마 판정은 검사기가 한다</b> —
      <code>python -m weave template tpl.json</code> ·
      <code>python -m weave values --template tpl.json values-a.json</code>
    </p>
  </div>
  <div class="pane view">
    <div class="viewport" id="view"></div>
  </div>
</div>
<script type="module">
/*__SCRIPT__*/
</script>
</body>
</html>
